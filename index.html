<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Hindi Music</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #fff;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1800&q=85")
        center / cover no-repeat fixed;

    transition: background-image .5s ease;
}

/* Dark overlay */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.12),
            rgba(0,0,0,.18) 40%,
            rgba(0,0,0,.84)
        );

    z-index: 0;
    pointer-events: none;
}


/* =========================================
   TOP BAR
========================================= */

.top-bar {
    position: relative;
    z-index: 20;

    width: 100%;
    max-width: 520px;

    margin: auto;

    padding: 30px 18px 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.clock {
    font-size: 28px;
    font-weight: 600;

    text-shadow:
        0 3px 15px rgba(0,0,0,.7);
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 8px 13px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 30px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    font-size: 11px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow:
        0 0 10px #00ff88;
}


/* =========================================
   BACKGROUND MENU
========================================= */

.bg-menu {
    position: fixed;

    z-index: 35;

    top: 85px;
    right: 12px;

    display: flex;
    flex-direction: column;

    gap: 6px;
}

.bg-btn {
    min-width: 145px;

    padding: 8px 11px;

    color: #fff;

    background:
        rgba(0,0,0,.48);

    border:
        1px solid rgba(255,255,255,.16);

    border-radius: 12px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    font-size: 11px;

    cursor: pointer;

    transition: .2s;
}

.bg-btn:hover {
    background:
        rgba(255,255,255,.18);
}

.bg-btn:active {
    transform: scale(.94);
}

.bg-btn.active {
    background:
        rgba(255,255,255,.22);
}

input[type="file"] {
    display: none;
}


/* =========================================
   SONG LIST
========================================= */

.song-list {
    position: fixed;

    z-index: 15;

    top: 95px;
    left: 50%;

    transform: translateX(-50%);

    width:
        calc(100% - 30px);

    max-width: 390px;

    max-height:
        calc(100vh - 285px);

    overflow-y: auto;

    padding: 8px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 24px;

    background:
        rgba(0,0,0,.32);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    scrollbar-width: thin;
}

.song-list::-webkit-scrollbar {
    width: 4px;
}

.song-list::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,.3);

    border-radius: 10px;
}


/* Individual song */

.song-item {
    width: 100%;

    padding: 9px;

    display: flex;
    align-items: center;

    gap: 10px;

    border: none;

    border-radius: 16px;

    color: white;

    background: transparent;

    text-align: left;

    cursor: pointer;

    transition:
        background .2s,
        transform .15s;
}

.song-item:hover {
    background:
        rgba(255,255,255,.1);
}

.song-item:active {
    transform: scale(.98);
}

.song-item.active {
    background:
        rgba(255,255,255,.17);
}


/* Thumbnail */

.song-thumb {
    width: 45px;
    height: 45px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 12px;

    background:
        rgba(255,255,255,.1);
}


/* Text */

.song-text {
    min-width: 0;
    flex: 1;
}

.song-name {
    font-size: 13px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist-small {
    margin-top: 3px;

    color:
        rgba(255,255,255,.55);

    font-size: 10px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* Playing dot */

.playing-indicator {
    width: 8px;
    height: 8px;

    flex-shrink: 0;

    border-radius: 50%;

    background:
        #00ff88;

    box-shadow:
        0 0 10px #00ff88;

    opacity: 0;
}

.song-item.active
.playing-indicator {
    opacity: 1;
}


/* =========================================
   PLAYER
========================================= */

.player {
    position: fixed;

    z-index: 40;

    left: 50%;
    bottom: 65px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 18px);

    max-width: 480px;

    min-height: 105px;

    padding: 11px 13px;

    display: flex;
    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(25,22,30,.91),
            rgba(8,8,12,.8)
        );

    border:
        1px solid rgba(255,255,255,.18);

    border-radius: 38px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


/* =========================================
   ALBUM ART
========================================= */

.album-art {
    width: 56px;
    height: 56px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    background: #222;

    box-shadow:
        0 5px 18px rgba(0,0,0,.55);
}

.album-art.playing {
    animation:
        spin 12s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================================
   CURRENT SONG
========================================= */

.current-song {
    flex: 1;
    min-width: 0;
}

.current-title {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.current-artist {
    margin-top: 4px;

    font-size: 11px;

    color:
        rgba(255,255,255,.62);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================
   PROGRESS
========================================= */

.progress {
    width: 100%;
    height: 4px;

    margin-top: 9px;

    background:
        rgba(255,255,255,.18);

    border-radius: 10px;

    overflow: hidden;

    cursor: pointer;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: white;

    border-radius: 10px;
}

.time {
    display: flex;
    justify-content: space-between;

    margin-top: 4px;

    color:
        rgba(255,255,255,.5);

    font-size: 9px;
}


/* =========================================
   CONTROLS
========================================= */

.controls {
    display: flex;
    align-items: center;

    gap: 1px;

    flex-shrink: 0;
}

.control {
    width: 30px;
    height: 34px;

    border: none;

    background: transparent;

    color: white;

    font-size: 14px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.control:active {
    transform: scale(.84);
}

.play {
    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 16px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);
}

.play:active {
    transform: scale(.92);
}


/* =========================================
   VOLUME
========================================= */

.volume-panel {
    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 180px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 50px);

    max-width: 300px;

    padding:
        13px 16px;

    background:
        rgba(0,0,0,.6);

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 20px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    display: none;
}

.volume-panel.show {
    display: block;
}

.volume-slider {
    width: 100%;
}


/* =========================================
   MESSAGE
========================================= */

.message {
    position: fixed;

    z-index: 60;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    padding:
        8px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(12px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .3s;
}

.message.show {
    opacity: 1;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:520px) {

    .top-bar {
        padding-top: 28px;
    }

    .clock {
        font-size: 25px;
    }

    .song-list {
        top: 90px;

        max-height:
            calc(100vh - 280px);
    }

    .player {
        bottom: 58px;
    }

    .album-art {
        width: 52px;
        height: 52px;
    }

    .play {
        width: 44px;
        height: 44px;
    }

}

@media(max-width:370px) {

    .song-list {
        max-height:
            calc(100vh - 270px);
    }

    .player {
        bottom: 50px;
    }

    .album-art {
        width: 47px;
        height: 47px;
    }

    .control {
        width: 25px;
    }

    .play {
        width: 41px;
        height: 41px;
    }

}
</style>
</head>


<body>


<!-- =========================================
     TOP BAR
========================================= -->

<div class="top-bar">

    <div
        class="clock"
        id="clock">
        00:00
    </div>

    <div class="status">

        <span class="status-dot"></span>

        <span>HINDI MUSIC</span>

    </div>

</div>


<!-- =========================================
     BACKGROUND MENU
========================================= -->

<div class="bg-menu">

    <button
        class="bg-btn"
        data-bg="0"
        onclick="changeBackground(0)">
        🌊 Ocean
    </button>

    <button
        class="bg-btn"
        data-bg="1"
        onclick="changeBackground(1)">
        🌌 Space
    </button>

    <button
        class="bg-btn"
        data-bg="2"
        onclick="changeBackground(2)">
        🌲 Forest
    </button>

    <button
        class="bg-btn"
        data-bg="3"
        onclick="changeBackground(3)">
        🌃 Night
    </button>

    <button
        class="bg-btn"
        data-bg="4"
        onclick="changeBackground(4)">
        🌅 Sunset
    </button>

    <button
        class="bg-btn"
        onclick="document.getElementById('backgroundUpload').click()">
        🖼️ My Background
    </button>

    <input
        type="file"
        id="backgroundUpload"
        accept="image/*"
        onchange="customBackground(event)">

</div>


<!-- =========================================
     SONG LIST
========================================= -->

<div
    class="song-list"
    id="songList">
</div>


<!-- =========================================
     VOLUME
========================================= -->

<div
    class="volume-panel"
    id="volumePanel">

    <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8">

</div>


<!-- =========================================
     AUDIO
========================================= -->

<audio
    id="audio"
    preload="metadata">
</audio>


<!-- =========================================
     PLAYER
========================================= -->

<div class="player">

    <img
        id="albumArt"
        class="album-art"
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&q=80"
        alt="Album artwork">

    <div class="current-song">

        <div
            class="current-title"
            id="currentTitle">
            Hindi Music
        </div>

        <div
            class="current-artist"
            id="currentArtist">
            Select a song
        </div>

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousTrack()">
            ⏮
        </button>

        <button
            class="play"
            id="playButton"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextTrack()">
            ⏭
        </button>

        <button
            class="control"
            onclick="toggleVolume()">
            🔊
        </button>

    </div>

</div>


<div
    class="message"
    id="message">
</div>


<script>

/* =====================================================
   MUSIC

   ADD YOUR LEGAL DIRECT AUDIO STREAMS HERE.

   Example:

   {
       title: "Song Name",
       artist: "Artist Name",
       url: "https://example.com/song.mp3",
       art: "https://example.com/cover.jpg"
   }

   The URL must be an actual audio stream/file.
===================================================== */

const tracks = [

    /*
    {
        title: "Hindi Song 1",
        artist: "Artist 1",
        url: "YOUR_DIRECT_AUDIO_URL",
        art: "YOUR_COVER_IMAGE_URL"
    },

    {
        title: "Hindi Song 2",
        artist: "Artist 2",
        url: "YOUR_DIRECT_AUDIO_URL",
        art: "YOUR_COVER_IMAGE_URL"
    },

    {
        title: "Hindi Song 3",
        artist: "Artist 3",
        url: "YOUR_DIRECT_AUDIO_URL",
        art: "YOUR_COVER_IMAGE_URL"
    }
    */

];


/* =========================================
   ELEMENTS
========================================= */

const audio =
    document.getElementById("audio");

const albumArt =
    document.getElementById("albumArt");

const currentTitle =
    document.getElementById("currentTitle");

const currentArtist =
    document.getElementById("currentArtist");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const songList =
    document.getElementById("songList");

const volumePanel =
    document.getElementById("volumePanel");

const volumeSlider =
    document.getElementById("volumeSlider");

const message =
    document.getElementById("message");


let currentTrack = 0;

let messageTimer;


/* =========================================
   DEFAULT ART
========================================= */

function defaultArt() {

    return "https://images.unsplash.com/" +
        "photo-1493225457124-a3eb161ffa5f" +
        "?w=300&q=80";

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   SONG LIST
========================================= */

function renderSongList() {

    songList.innerHTML = "";

    if (!tracks.length) {

        songList.innerHTML = `
            <div style="
                padding:25px 15px;
                text-align:center;
                color:rgba(255,255,255,.6);
                font-size:12px;
                line-height:1.7;
            ">
                🎵 No songs added yet
                <br>
                Add your audio streams
                to the <b>tracks</b> array.
            </div>
        `;

        return;
    }


    tracks.forEach((track, index) => {

        const item =
            document.createElement("button");

        item.className =
            "song-item";

        item.innerHTML = `

            <img
                class="song-thumb"
                src="${escapeHTML(
                    track.art || defaultArt()
                )}"
                alt="">

            <div class="song-text">

                <div class="song-name">
                    ${escapeHTML(track.title)}
                </div>

                <div class="song-artist-small">
                    ${escapeHTML(track.artist)}
                </div>

            </div>

            <span class="playing-indicator"></span>
        `;


        item.addEventListener(
            "click",
            () => selectTrack(index)
        );


        songList.appendChild(item);

    });


    updateActiveSong();

}


/* =========================================
   SELECT SONG
========================================= */

function selectTrack(index) {

    loadTrack(index);

    playTrack();

}


/* =========================================
   LOAD SONG
========================================= */

function loadTrack(index) {

    if (!tracks.length) return;


    currentTrack =
        (index + tracks.length) %
        tracks.length;


    const track =
        tracks[currentTrack];


    audio.src =
        track.url;


    currentTitle.textContent =
        track.title;


    currentArtist.textContent =
        track.artist;


    albumArt.src =
        track.art || defaultArt();


    progressFill.style.width =
        "0%";


    currentTime.textContent =
        "0:00";


    duration.textContent =
        "0:00";


    updateActiveSong();

    updateMediaSession();

}


/* =========================================
   ACTIVE SONG
========================================= */

function updateActiveSong() {

    document
        .querySelectorAll(".song-item")
        .forEach((item, index) => {

            item.classList.toggle(
                "active",
                index === currentTrack
            );

        });

}


/* =========================================
   PLAY
========================================= */

async function playTrack() {

    if (!tracks.length) {

        showMessage(
            "Add songs to the tracks array first."
        );

        return;
    }


    try {

        await audio.play();

    } catch (error) {

        console.error(error);

        showMessage(
            "Playback could not start."
        );

    }

}


/* =========================================
   PAUSE
========================================= */

function pauseTrack() {

    audio.pause();

}


/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay() {

    if (!tracks.length) {

        showMessage(
            "No songs are configured."
        );

        return;
    }


    if (audio.paused) {

        playTrack();

    } else {

        pauseTrack();

    }

}


/* =========================================
   NEXT
========================================= */

function nextTrack() {

    if (!tracks.length) return;


    currentTrack =
        (currentTrack + 1) %
        tracks.length;


    loadTrack(currentTrack);

    playTrack();

}


/* =========================================
   PREVIOUS
========================================= */

function previousTrack() {

    if (!tracks.length) return;


    if (audio.currentTime > 3) {

        audio.currentTime = 0;

        return;

    }


    currentTrack =
        (currentTrack - 1 +
            tracks.length) %
        tracks.length;


    loadTrack(currentTrack);

    playTrack();

}


/* =========================================
   AUDIO EVENTS
========================================= */

audio.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "❚❚";

        albumArt.classList.add(
            "playing"
        );

        if (
            "mediaSession" in navigator
        ) {

            navigator.mediaSession.playbackState =
                "playing";

        }

        updateActiveSong();

    }
);


audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

        if (
            "mediaSession" in navigator
        ) {

            navigator.mediaSession.playbackState =
                "paused";

        }

    }
);


audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);

    }
);


audio.addEventListener(
    "timeupdate",
    () => {

        if (
            !audio.duration ||
            !isFinite(audio.duration)
        ) return;


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percent + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* Automatically play next */

audio.addEventListener(
    "ended",
    () => {

        nextTrack();

    }
);


audio.addEventListener(
    "error",
    () => {

        showMessage(
            "Unable to load this audio stream."
        );

    }
);


/* =========================================
   SEEK
========================================= */

progress.addEventListener(
    "click",
    event => {

        if (
            !audio.duration ||
            !isFinite(audio.duration)
        ) return;


        const rect =
            progress.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    position / rect.width
                )
            );


        audio.currentTime =
            audio.duration * percent;

    }
);


/* =========================================
   VOLUME
========================================= */

audio.volume = 0.8;


volumeSlider.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(volumeSlider.value);

    }
);


function toggleVolume() {

    volumePanel.classList.toggle(
        "show"
    );

}


/* =========================================
   MEDIA SESSION
========================================= */

function updateMediaSession() {

    if (
        !("mediaSession" in navigator) ||
        !tracks.length
    ) return;


    const track =
        tracks[currentTrack];


    if (
        "MediaMetadata" in window
    ) {

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    track.title,

                artist:
                    track.artist,

                album:
                    "Hindi Music",

                artwork:
                    track.art
                    ? [{
                        src:
                            track.art,

                        sizes:
                            "512x512",

                        type:
                            "image/jpeg"
                    }]
                    : []

            });

    }

}


/* =========================================
   MEDIA CONTROLS
========================================= */

if (
    "mediaSession" in navigator
) {

    try {

        navigator.mediaSession.setActionHandler(
            "play",
            () => playTrack()
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => pauseTrack()
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => nextTrack()
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => previousTrack()
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => {

                if (audio.duration) {

                    audio.currentTime =
                        Math.min(
                            audio.duration,
                            audio.currentTime + 10
                        );

                }

            }
        );

    } catch (error) {

        console.log(
            "Media Session controls unavailable."
        );

    }

}


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds) {

    if (
        !seconds ||
        !isFinite(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* =========================================
   BACKGROUNDS
========================================= */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1800&q=85",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1800&q=85",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1800&q=85",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1800&q=85",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1800&q=85"

];


function changeBackground(index) {

    const image =
        backgrounds[index];


    document.body.style.backgroundImage =
        `url("${image}")`;


    localStorage.setItem(
        "musicBackground",
        image
    );


    document
        .querySelectorAll(
            ".bg-btn[data-bg]"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.dataset.bg) === index
            );

        });

}


/* =========================================
   CUSTOM BACKGROUND
========================================= */

function customBackground(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    if (
        !file.type.startsWith("image/")
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        event => {

            const image =
                event.target.result;


            document.body.style.backgroundImage =
                `url("${image}")`;


            try {

                localStorage.setItem(
                    "customBackground",
                    image
                );

            } catch (error) {

                console.log(
                    "Image too large for storage."
                );

            }

        };


    reader.readAsDataURL(file);

}


/* =========================================
   RESTORE BACKGROUND
========================================= */

const customBackgroundSaved =
    localStorage.getItem(
        "customBackground"
    );


const normalBackgroundSaved =
    localStorage.getItem(
        "musicBackground"
    );


if (customBackgroundSaved) {

    document.body.style.backgroundImage =
        `url("${customBackgroundSaved}")`;

} else if (normalBackgroundSaved) {

    document.body.style.backgroundImage =
        `url("${normalBackgroundSaved}")`;

}


/* =========================================
   CLOCK
========================================= */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================================
   MESSAGE
========================================= */

function showMessage(text) {

    message.textContent =
        text;

    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                message.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =========================================
   INITIALIZE
========================================= */

renderSongList();


if (tracks.length) {

    loadTrack(0);

}

</script>

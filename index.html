<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Music Room</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=80")
        center / cover no-repeat fixed;

    display: flex;
    flex-direction: column;
    align-items: center;

    color: white;
    font-family: Arial, Helvetica, sans-serif;

    overflow: hidden;

    transition: background-image .5s ease;
}

/* Dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.28),
            rgba(0,0,0,.12),
            rgba(0,0,0,.72)
        );

    z-index: 0;
    pointer-events: none;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 480px;

    padding: 45px 16px 0;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.clock {
    font-size: 28px;
    font-weight: 600;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 9px 15px;

    background: rgba(0,0,0,.48);

    border: 1px solid rgba(255,255,255,.14);

    border-radius: 25px;

    backdrop-filter: blur(15px);

    font-size: 14px;
}

.status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow: 0 0 10px #00ff88;
}

/* =========================
   BACKGROUND MENU
========================= */

.bg-menu {
    position: fixed;

    top: 110px;
    right: 12px;

    display: flex;
    flex-direction: column;
    gap: 7px;

    z-index: 20;
}

.bg-btn {
    padding: 9px 13px;

    color: white;

    background: rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 12px;

    backdrop-filter: blur(14px);

    font-size: 14px;

    cursor: pointer;

    transition: .2s;
}

.bg-btn:hover {
    background: rgba(255,255,255,.18);
}

.bg-btn:active {
    transform: scale(.95);
}

input[type="file"] {
    display: none;
}

/* =========================
   PLAYER
========================= */

.player {
    position: fixed;

    left: 50%;
    bottom: 85px;

    transform: translateX(-50%);

    width: calc(100% - 24px);
    max-width: 460px;

    padding: 12px 15px;

    display: flex;
    align-items: center;

    gap: 12px;

    background:
        rgba(20,18,24,.76);

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius: 40px;

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);

    box-shadow:
        0 18px 55px rgba(0,0,0,.65),
        0 0 30px rgba(80,120,255,.08);

    z-index: 30;
}

/* =========================
   ART
========================= */

.album-art {
    width: 58px;
    height: 58px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    box-shadow:
        0 5px 18px rgba(0,0,0,.55);

    animation:
        spin 12s linear infinite;

    animation-play-state: paused;
}

.album-art.playing {
    animation-play-state: running;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================
   SONG INFO
========================= */

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 15px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 3px;

    font-size: 12px;

    color: #cfcfcf;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   PROGRESS
========================= */

.progress {
    width: 100%;
    height: 4px;

    margin-top: 8px;

    background:
        rgba(255,255,255,.20);

    border-radius: 5px;

    overflow: hidden;

    cursor: pointer;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: white;

    border-radius: 5px;
}

.time {
    display: flex;
    justify-content: space-between;

    margin-top: 4px;

    font-size: 9px;

    color: #aaa;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    align-items: center;
    gap: 3px;

    flex-shrink: 0;
}

.control {
    width: 31px;
    height: 31px;

    border: none;

    background: transparent;

    color: white;

    font-size: 15px;

    cursor: pointer;

    opacity: .9;
}

.control:active {
    transform: scale(.9);
}

.play {
    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 16px;

    cursor: pointer;

    box-shadow:
        0 5px 18px rgba(0,0,0,.45);
}

/* =========================
   LOADING
========================= */

.loading {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 40;

    padding: 8px 15px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.55);

    backdrop-filter: blur(10px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition: opacity .3s;
}

.loading.show {
    opacity: 1;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px) {

    .top-bar {
        padding-top: 45px;
    }

    .clock {
        font-size: 26px;
    }

    .status {
        font-size: 13px;
    }

    .bg-menu {
        top: 105px;
    }

    .player {
        bottom: 85px;

        padding:
            11px 12px;

        gap: 9px;
    }

    .album-art {
        width: 52px;
        height: 52px;
    }

    .song-title {
        font-size: 14px;
    }

    .song-artist {
        font-size: 11px;
    }

    .play {
        width: 43px;
        height: 43px;
    }
}
</style>
</head>

<body>

<!-- =========================
     TOP
========================= -->

<div class="top-bar">

    <div class="clock" id="clock">
        00:00
    </div>

    <div class="status">

        <span class="status-dot"></span>

        <span>ONLINE MUSIC</span>

    </div>

</div>


<!-- =========================
     BACKGROUNDS
========================= -->

<div class="bg-menu">

    <button
        class="bg-btn"
        onclick="changeBackground(0)">
        🌊 Ocean
    </button>

    <button
        class="bg-btn"
        onclick="changeBackground(1)">
        🌌 Space
    </button>

    <button
        class="bg-btn"
        onclick="changeBackground(2)">
        🌲 Forest
    </button>

    <button
        class="bg-btn"
        onclick="changeBackground(3)">
        🌃 Night
    </button>

    <button
        class="bg-btn"
        onclick="changeBackground(4)">
        🌅 Sunset
    </button>

    <button
        class="bg-btn"
        onclick="document
        .getElementById('backgroundUpload')
        .click()">
        🖼️ My Background
    </button>

    <input
        id="backgroundUpload"
        type="file"
        accept="image/*"
        onchange="customBackground(event)"
    >

</div>


<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <img
        id="albumArt"
        class="album-art"

        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&q=80"

        alt="Album Art"
    >

    <div class="song-info">

        <div
            class="song-title"
            id="songTitle">

            Loading music...

        </div>

        <div
            class="song-artist"
            id="songArtist">

            Connecting to Jamendo...

        </div>

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousTrack()">
            ⏮
        </button>

        <button
            class="play"
            id="playButton"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextTrack()">
            ⏭
        </button>

        <button
            class="control"
            id="volumeButton"
            onclick="toggleMute()">
            🔊
        </button>

    </div>

</div>


<!-- AUDIO -->

<audio
    id="audio"
    preload="metadata"
    playsinline>
</audio>


<div
    class="loading"
    id="loading">
    Loading music...
</div>


<script>

/* =====================================================
   JAMENDO CONFIGURATION
===================================================== */

/*
   Jamendo provides this client ID specifically
   for testing the READ API.

   For your permanent public website, replace this
   with your own client_id from the Jamendo Developer
   Portal.
*/

const JAMENDO_CLIENT_ID = "709fa152";


/*
   No fetch() here.

   We use JSONP because Jamendo supports JSONP
   callbacks for GET requests. This avoids the
   browser CORS problem that was causing your
   previous "Unable to load music" message.
*/

const JAMENDO_API =
    "https://api.jamendo.com/v3.0/tracks/";


let tracks = [];
let currentTrack = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("audio");

const albumArt =
    document.getElementById("albumArt");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playButton =
    document.getElementById("playButton");

const volumeButton =
    document.getElementById("volumeButton");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const loading =
    document.getElementById("loading");


/* =====================================================
   LOADING MESSAGE
===================================================== */

function showLoading(text) {

    loading.textContent = text;

    loading.classList.add("show");

}


function hideLoading() {

    loading.classList.remove("show");

}


/* =====================================================
   JAMENDO JSONP
===================================================== */

function loadJamendoMusic() {

    showLoading("Loading music from Jamendo...");

    songTitle.textContent =
        "Loading music...";

    songArtist.textContent =
        "Jamendo";


    /*
       Remove an old callback if one exists.
    */

    window.jamendoCallback = function(data) {

        try {

            if (
                !data ||
                !data.results ||
                !data.results.length
            ) {

                throw new Error(
                    "Jamendo returned no tracks."
                );

            }


            /*
               Only keep tracks that contain
               an audio stream.
            */

            tracks =
                data.results.filter(
                    track =>
                        track.audio &&
                        track.id
                );


            if (!tracks.length) {

                throw new Error(
                    "No playable tracks."
                );

            }


            /*
               Randomize playlist.
            */

            shuffle(tracks);


            currentTrack = 0;

            loadTrack(currentTrack);

            hideLoading();


        } catch(error) {

            console.error(error);

            showError(
                "No playable music found"
            );

        }

    };


    /*
       JSONP script.

       IMPORTANT:
       Do not change callback=jamendoCallback.
    */

    const script =
        document.createElement("script");


    const params = new URLSearchParams({

        client_id:
            JAMENDO_CLIENT_ID,

        format:
            "json",

        limit:
            "30",

        featured:
            "1",

        tags:
            "lounge",

        audioformat:
            "mp32",

        imagesize:
            "300",

        callback:
            "jamendoCallback"

    });


    script.src =
        JAMENDO_API +
        "?" +
        params.toString();


    script.onerror =
        function() {

            showError(
                "Jamendo connection failed"
            );

        };


    document.body.appendChild(script);

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

    hideLoading();

    songTitle.textContent =
        "Unable to load music";

    songArtist.textContent =
        message;

    playButton.textContent =
        "▶";

    albumArt.classList.remove(
        "playing"
    );

}


/* =====================================================
   LOAD TRACK
===================================================== */

function loadTrack(index) {

    if (!tracks.length)
        return;


    const track =
        tracks[index];


    songTitle.textContent =
        track.name ||
        "Unknown Track";


    songArtist.textContent =
        track.artist_name ||
        "Unknown Artist";


    if (track.image) {

        albumArt.src =
            track.image;

    }


    /*
       IMPORTANT:

       Jamendo's API returns the direct
       audio stream in track.audio.
    */

    audio.src =
        track.audio;


    audio.load();


    progressFill.style.width =
        "0%";


    currentTime.textContent =
        "0:00";


    duration.textContent =
        formatTime(
            Number(track.duration)
        );

}


/* =====================================================
   PLAY
===================================================== */

function playMusic() {

    if (!audio.src) {

        return;

    }


    audio.play()

        .then(() => {

            playButton.textContent =
                "❚❚";

            albumArt.classList.add(
                "playing"
            );

        })

        .catch(error => {

            console.error(
                "Playback error:",
                error
            );

            /*
               Browser autoplay protection
               may require another tap.
            */

            playButton.textContent =
                "▶";

        });

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay() {

    if (audio.paused) {

        playMusic();

    } else {

        audio.pause();

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextTrack() {

    if (!tracks.length)
        return;


    currentTrack++;

    if (
        currentTrack >=
        tracks.length
    ) {

        currentTrack = 0;

    }


    loadTrack(currentTrack);

    playMusic();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousTrack() {

    if (!tracks.length)
        return;


    currentTrack--;

    if (currentTrack < 0) {

        currentTrack =
            tracks.length - 1;

    }


    loadTrack(currentTrack);

    playMusic();

}


/* =====================================================
   AUTOMATIC NEXT TRACK
===================================================== */

audio.addEventListener(
    "ended",
    function() {

        nextTrack();

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (!audio.duration)
            return;


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percent + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "click",
    function(event) {

        if (!audio.duration)
            return;


        const rect =
            progress.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            position /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;

    }
);


/* =====================================================
   AUDIO ERROR
===================================================== */

audio.addEventListener(
    "error",
    function() {

        console.error(
            "Audio stream error",
            audio.error
        );


        /*
           Try the next Jamendo track
           if a particular stream fails.
        */

        if (tracks.length > 1) {

            setTimeout(
                nextTrack,
                500
            );

        }

    }
);


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* =====================================================
   MUTE
===================================================== */

function toggleMute() {

    audio.muted =
        !audio.muted;


    volumeButton.textContent =
        audio.muted
        ? "🔇"
        : "🔊";

}


/* =====================================================
   BACKGROUNDS
===================================================== */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=80",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600&q=80",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600&q=80",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600&q=80"

];


function changeBackground(index) {

    const image =
        backgrounds[index];


    document.body.style.backgroundImage =
        `url("${image}")`;


    localStorage.setItem(
        "selectedBackground",
        image
    );

}


/* =====================================================
   CUSTOM BACKGROUND
===================================================== */

function customBackground(event) {

    const file =
        event.target.files[0];


    if (!file)
        return;


    if (
        !file.type.startsWith("image/")
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const image =
                e.target.result;


            document.body.style.backgroundImage =
                `url("${image}")`;


            localStorage.setItem(
                "customBackground",
                image
            );

        };


    reader.readAsDataURL(file);

}


/* =====================================================
   RESTORE BACKGROUND
===================================================== */

const savedCustom =
    localStorage.getItem(
        "customBackground"
    );

const savedBackground =
    localStorage.getItem(
        "selectedBackground"
    );


if (savedCustom) {

    document.body.style.backgroundImage =
        `url("${savedCustom}")`;

} else if (savedBackground) {

    document.body.style.backgroundImage =
        `url("${savedBackground}")`;

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   START JAMENDO
===================================================== */

loadJamendoMusic();


/* =====================================================
   FIRST USER INTERACTION
===================================================== */

/*
   Browsers block unsolicited autoplay.

   After the visitor interacts with the page,
   we are allowed to attempt playback.

   The normal Play button remains available.
*/

let firstInteraction = false;


document.addEventListener(
    "click",
    function() {

        if (firstInteraction)
            return;


        firstInteraction = true;


        /*
           Only start if music has already
           loaded and the player is currently
           paused.
        */

        if (
            tracks.length &&
            audio.paused &&
            audio.src
        ) {

            playMusic();

        }

    },
    {
        once: false
    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Hindi Music</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #fff;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1800&q=85")
        center / cover no-repeat;

    transition: background-image .5s ease;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.15),
            rgba(0,0,0,.15) 35%,
            rgba(0,0,0,.78)
        );

    z-index: 0;
    pointer-events: none;
}


/* =========================
   TOP BAR
========================= */

.top-bar {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 520px;

    margin: auto;

    padding: 38px 18px 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.clock {
    font-size: 28px;
    font-weight: 600;

    text-shadow:
        0 3px 15px rgba(0,0,0,.6);
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 8px 13px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 30px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    font-size: 11px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow:
        0 0 10px #00ff88;
}


/* =========================
   BACKGROUND MENU
========================= */

.bg-menu {
    position: fixed;

    z-index: 30;

    top: 100px;
    right: 12px;

    display: flex;
    flex-direction: column;

    gap: 7px;
}

.bg-btn {
    min-width: 155px;

    padding: 9px 12px;

    color: white;

    background:
        rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius: 13px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    font-size: 12px;

    cursor: pointer;

    transition: .2s;
}

.bg-btn:hover {
    background:
        rgba(255,255,255,.18);
}

.bg-btn:active {
    transform: scale(.94);
}

.bg-btn.active {
    background:
        rgba(255,255,255,.22);
}

input[type="file"] {
    display: none;
}


/* =========================
   PLAYER
========================= */

.player {
    position: fixed;

    z-index: 40;

    left: 50%;
    bottom: 82px;

    transform: translateX(-50%);

    width:
        calc(100% - 18px);

    max-width: 480px;

    min-height: 105px;

    padding: 11px 13px;

    display: flex;
    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(25,22,30,.88),
            rgba(8,8,12,.76)
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 38px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


/* =========================
   ART
========================= */

.album-art {
    width: 56px;
    height: 56px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    background: #222;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.55);
}

.album-art.playing {
    animation:
        spin 12s linear infinite;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================
   SONG INFO
========================= */

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 4px;

    font-size: 11px;

    color:
        rgba(255,255,255,.62);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================
   PROGRESS
========================= */

.progress {
    width: 100%;
    height: 4px;

    margin-top: 9px;

    background:
        rgba(255,255,255,.18);

    border-radius: 10px;

    overflow: hidden;

    cursor: pointer;
}

.progress-fill {
    width: 0%;
    height: 100%;

    background: white;

    border-radius: 10px;
}

.time {
    display: flex;
    justify-content: space-between;

    margin-top: 4px;

    color:
        rgba(255,255,255,.5);

    font-size: 9px;
}


/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    align-items: center;

    gap: 2px;

    flex-shrink: 0;
}

.control {
    width: 30px;
    height: 34px;

    border: none;

    background: transparent;

    color: white;

    font-size: 15px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.control:active {
    transform: scale(.85);
}

.play {
    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 16px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);
}

.play:active {
    transform: scale(.92);
}


/* =========================
   VOLUME
========================= */

.volume-panel {
    position: fixed;

    z-index: 45;

    left: 50%;
    bottom: 192px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 40px);

    max-width: 300px;

    padding: 12px 16px;

    background:
        rgba(0,0,0,.55);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 20px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    display: none;
}

.volume-panel.show {
    display: block;
}

.volume-slider {
    width: 100%;
    cursor: pointer;
}


/* =========================
   MESSAGE
========================= */

.message {
    position: fixed;

    z-index: 60;

    left: 50%;
    bottom: 28px;

    transform:
        translateX(-50%);

    padding: 8px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.6);

    backdrop-filter: blur(12px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition: opacity .3s;
}

.message.show {
    opacity: 1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px) {

    .player {
        bottom: 82px;
    }

    .album-art {
        width: 52px;
        height: 52px;
    }

    .play {
        width: 44px;
        height: 44px;
    }

}

@media(max-width:370px) {

    .player {
        bottom: 65px;
    }

    .album-art {
        width: 47px;
        height: 47px;
    }

    .control {
        width: 26px;
    }

    .play {
        width: 41px;
        height: 41px;
    }

}
</style>
</head>

<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="top-bar">

    <div
        class="clock"
        id="clock">
        00:00
    </div>

    <div class="status">

        <span class="status-dot"></span>

        <span>
            HINDI MUSIC
        </span>

    </div>

</div>


<!-- =========================
     BACKGROUND MENU
========================= -->

<div class="bg-menu">

    <button
        class="bg-btn"
        data-bg="0"
        onclick="changeBackground(0)">
        🌊 Ocean
    </button>

    <button
        class="bg-btn"
        data-bg="1"
        onclick="changeBackground(1)">
        🌌 Space
    </button>

    <button
        class="bg-btn"
        data-bg="2"
        onclick="changeBackground(2)">
        🌲 Forest
    </button>

    <button
        class="bg-btn"
        data-bg="3"
        onclick="changeBackground(3)">
        🌃 Night
    </button>

    <button
        class="bg-btn"
        data-bg="4"
        onclick="changeBackground(4)">
        🌅 Sunset
    </button>

    <button
        class="bg-btn"
        onclick="
        document
        .getElementById('backgroundUpload')
        .click()">
        🖼️ My Background
    </button>

    <input
        type="file"
        id="backgroundUpload"
        accept="image/*"
        onchange="customBackground(event)">

</div>


<!-- =========================
     VOLUME
========================= -->

<div
    class="volume-panel"
    id="volumePanel">

    <input
        class="volume-slider"
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.8">

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
    id="audio"
    preload="metadata">
</audio>


<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <img
        id="albumArt"
        class="album-art"
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&q=80"
        alt="Album">

    <div class="song-info">

        <div
            class="song-title"
            id="songTitle">
            Hindi Music
        </div>

        <div
            class="song-artist"
            id="songArtist">
            Tap Play to start
        </div>

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousTrack()">
            ⏮
        </button>

        <button
            class="play"
            id="playButton"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextTrack()">
            ⏭
        </button>

        <button
            class="control"
            onclick="toggleVolume()">
            🔊
        </button>

    </div>

</div>


<div
    class="message"
    id="message">
</div>


<script>

/* =====================================================
   MUSIC PLAYLIST
===================================================== */

/*
 IMPORTANT:

 Put ONLY direct audio URLs here from a source that
 explicitly permits your website to stream them.

 Do NOT put YouTube page URLs here.

 Example format:

 {
     title: "Example Song",
     artist: "Example Artist",
     url: "https://your-licensed-domain.com/song.mp3",
     art: "https://your-domain.com/cover.jpg"
 }

*/

const tracks = [

    /*
    {
        title: "Hindi Song 1",
        artist: "Artist",
        url: "YOUR_DIRECT_AUDIO_URL",
        art: "YOUR_COVER_IMAGE_URL"
    },

    {
        title: "Hindi Song 2",
        artist: "Artist",
        url: "YOUR_DIRECT_AUDIO_URL",
        art: "YOUR_COVER_IMAGE_URL"
    }
    */

];


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("audio");

const albumArt =
    document.getElementById("albumArt");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const volumeSlider =
    document.getElementById("volumeSlider");

const volumePanel =
    document.getElementById("volumePanel");

const message =
    document.getElementById("message");


/* =====================================================
   STATE
===================================================== */

let currentTrack = 0;


/* =====================================================
   LOAD TRACK
===================================================== */

function loadTrack(index) {

    if (!tracks.length) {

        songTitle.textContent =
            "No music added";

        songArtist.textContent =
            "Add licensed stream URLs";

        showMessage(
            "Add your legal music streams to the tracks array"
        );

        return;

    }


    currentTrack =
        (index + tracks.length) %
        tracks.length;


    const track =
        tracks[currentTrack];


    audio.src =
        track.url;


    songTitle.textContent =
        track.title;


    songArtist.textContent =
        track.artist;


    if (track.art) {

        albumArt.src =
            track.art;

    }


    progressFill.style.width =
        "0%";


    currentTime.textContent =
        "0:00";


    duration.textContent =
        "0:00";


    updateMediaSession();


}


/* =====================================================
   PLAY
===================================================== */

async function playTrack() {

    if (!tracks.length) {

        showMessage(
            "No music source configured"
        );

        return;

    }


    try {

        await audio.play();

    } catch(error) {

        console.error(error);

        showMessage(
            "Playback could not start"
        );

    }

}


/* =====================================================
   PAUSE
===================================================== */

function pauseTrack() {

    audio.pause();

}


/* =====================================================
   TOGGLE
===================================================== */

function togglePlay() {

    if (!tracks.length) {

        showMessage(
            "Add music streams first"
        );

        return;

    }


    if (audio.paused) {

        playTrack();

    } else {

        pauseTrack();

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextTrack() {

    if (!tracks.length) {
        return;
    }


    currentTrack =
        (currentTrack + 1) %
        tracks.length;


    loadTrack(currentTrack);

    playTrack();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousTrack() {

    if (!tracks.length) {
        return;
    }


    /*
       If the song has played for more than 3 seconds,
       restart it instead of changing tracks.
    */

    if (audio.currentTime > 3) {

        audio.currentTime = 0;

        return;

    }


    currentTrack =
        (currentTrack - 1 +
        tracks.length) %
        tracks.length;


    loadTrack(currentTrack);

    playTrack();

}


/* =====================================================
   AUDIO EVENTS
===================================================== */

audio.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚";

        albumArt.classList.add(
            "playing"
        );

        updateMediaSession();

    }
);


audio.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

        updateMediaSession();

    }
);


audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !audio.duration ||
            !isFinite(audio.duration)
        ) {
            return;
        }


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


audio.addEventListener(
    "ended",
    function() {

        nextTrack();

    }
);


audio.addEventListener(
    "error",
    function() {

        showMessage(
            "Unable to load this stream"
        );

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "click",
    function(event) {

        if (
            !audio.duration ||
            !isFinite(audio.duration)
        ) {
            return;
        }


        const rect =
            progress.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    position /
                    rect.width
                )
            );


        audio.currentTime =
            audio.duration *
            percent;

    }
);


/* =====================================================
   VOLUME
===================================================== */

audio.volume = 0.8;


volumeSlider.addEventListener(
    "input",
    function() {

        audio.volume =
            Number(
                volumeSlider.value
            );

    }
);


function toggleVolume() {

    volumePanel.classList.toggle(
        "show"
    );

}


/* =====================================================
   MEDIA SESSION API
===================================================== */

/*
 This is what allows compatible Android browsers to
 expose the music on the lock screen / notification.

 It also allows hardware/media buttons to control
 the player.
*/

function updateMediaSession() {

    if (
        !("mediaSession" in navigator) ||
        !tracks.length
    ) {
        return;
    }


    const track =
        tracks[currentTrack];


    if (
        "MediaMetadata" in window
    ) {

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    track.title,

                artist:
                    track.artist,

                album:
                    "Hindi Music",

                artwork:
                    track.art
                    ? [
                        {
                            src: track.art,
                            sizes: "512x512",
                            type: "image/jpeg"
                        }
                    ]
                    : []

            });

    }


    navigator.mediaSession.playbackState =
        audio.paused
        ? "paused"
        : "playing";

}


/* =====================================================
   MEDIA CONTROLS
===================================================== */

if (
    "mediaSession" in navigator
) {

    navigator.mediaSession.setActionHandler(
        "play",
        function() {
            playTrack();
        }
    );


    navigator.mediaSession.setActionHandler(
        "pause",
        function() {
            pauseTrack();
        }
    );


    navigator.mediaSession.setActionHandler(
        "previoustrack",
        function() {
            previousTrack();
        }
    );


    navigator.mediaSession.setActionHandler(
        "nexttrack",
        function() {
            nextTrack();
        }
    );


    try {

        navigator.mediaSession.setActionHandler(
            "seekbackward",
            function() {

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - 10
                    );

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            function() {

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 10
                    );

            }
        );

    } catch(error) {

        console.log(
            "Seek controls unavailable"
        );

    }

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {

    if (
        !seconds ||
        !isFinite(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* =====================================================
   BACKGROUNDS
===================================================== */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1800&q=85",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1800&q=85",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1800&q=85",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1800&q=85",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1800&q=85"

];


function changeBackground(index) {

    const image =
        backgrounds[index];


    document.body.style.backgroundImage =
        `url("${image}")`;


    localStorage.setItem(
        "musicBackground",
        image
    );


    document
        .querySelectorAll(
            ".bg-btn[data-bg]"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    Number(
                        button.dataset.bg
                    ) === index
                );

            }
        );

}


/* =====================================================
   CUSTOM BACKGROUND
===================================================== */

function customBackground(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const image =
                e.target.result;


            document.body.style.backgroundImage =
                `url("${image}")`;


            try {

                localStorage.setItem(
                    "customBackground",
                    image
                );

            } catch(error) {

                console.log(
                    "Background too large for storage."
                );

            }

        };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   RESTORE BACKGROUND
===================================================== */

const custom =
    localStorage.getItem(
        "customBackground"
    );


const saved =
    localStorage.getItem(
        "musicBackground"
    );


if (custom) {

    document.body.style.backgroundImage =
        `url("${custom}")`;

} else if (saved) {

    document.body.style.backgroundImage =
        `url("${saved}")`;

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;


function showMessage(text) {

    message.textContent =
        text;

    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function() {

                message.classList.remove(
                    "show"
                );

            },
            3000
        );

}


/* =====================================================
   INITIALIZE
===================================================== */

if (tracks.length) {

    loadTrack(0);

} else {

    songTitle.textContent =
        "Hindi Music";

    songArtist.textContent =
        "Add your licensed tracks";

}

</script>

</body>
</html>

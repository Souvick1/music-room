<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#0b1018">

<title>Music Room</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    color:white;
    font-family:Arial,Helvetica,sans-serif;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1800&q=85")
        center/cover no-repeat fixed;

    transition:background-image .5s ease;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.12),
            rgba(0,0,0,.15) 45%,
            rgba(0,0,0,.82)
        );

    pointer-events:none;
}


/* =========================
   CLOCK
========================= */

.top-bar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:28px 18px 0;
}

.clock{
    font-size:28px;
    font-weight:600;

    text-shadow:
        0 3px 15px rgba(0,0,0,.7);
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    padding:10px 15px;

    border-radius:30px;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#00ff88;

    box-shadow:
        0 0 12px #00ff88;
}


/* =========================
   BACKGROUND BUTTONS
========================= */

.bg-menu{
    position:fixed;

    top:90px;
    right:10px;

    z-index:30;

    display:flex;
    flex-direction:column;
    gap:7px;
}

.bg-btn{
    min-width:145px;

    padding:10px 12px;

    color:white;

    background:rgba(0,0,0,.48);

    border:
        1px solid rgba(255,255,255,.17);

    border-radius:15px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    font-size:12px;

    cursor:pointer;

    transition:.2s;
}

.bg-btn:active{
    transform:scale(.95);
}

.bg-btn.active{
    background:rgba(255,255,255,.23);
}

input[type=file]{
    display:none;
}


/* =========================
   SONG LIST
========================= */

.song-list{
    position:fixed;

    top:110px;
    left:16px;

    z-index:10;

    width:calc(100% - 190px);
    max-width:330px;

    max-height:calc(100vh - 360px);

    overflow-y:auto;

    padding:8px;

    border-radius:22px;

    background:rgba(0,0,0,.28);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    scrollbar-width:thin;
}

.song-list::-webkit-scrollbar{
    width:3px;
}

.song-list::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.3);
    border-radius:10px;
}

.song-item{
    width:100%;

    display:flex;
    align-items:center;
    gap:9px;

    padding:8px;

    color:white;

    background:transparent;

    border:none;
    border-radius:15px;

    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.song-item:hover,
.song-item.active{
    background:rgba(255,255,255,.15);
}

.song-item:active{
    transform:scale(.98);
}

.song-thumb{
    width:43px;
    height:43px;

    flex-shrink:0;

    object-fit:cover;

    border-radius:11px;
}

.song-text{
    min-width:0;
    flex:1;
}

.song-title{
    font-size:12px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-artist{
    margin-top:4px;

    color:rgba(255,255,255,.55);

    font-size:10px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playing-dot{
    width:7px;
    height:7px;

    flex-shrink:0;

    border-radius:50%;

    background:#00ff88;

    box-shadow:0 0 10px #00ff88;

    opacity:0;
}

.song-item.active .playing-dot{
    opacity:1;
}


/* =========================
   HIDDEN YOUTUBE PLAYER
========================= */

#youtube-player{
    position:fixed;

    width:200px;
    height:200px;

    left:-10000px;
    top:-10000px;

    opacity:0;

    pointer-events:none;
}


/* =========================
   PLAYER
========================= */

.player{
    position:fixed;

    z-index:50;

    left:50%;
    bottom:62px;

    transform:translateX(-50%);

    width:calc(100% - 20px);
    max-width:490px;

    min-height:112px;

    padding:12px 14px;

    display:flex;
    align-items:center;
    gap:10px;

    background:
        linear-gradient(
            135deg,
            rgba(24,22,30,.94),
            rgba(5,7,12,.86)
        );

    border:
        1px solid rgba(255,255,255,.18);

    border-radius:38px;

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.08);
}


/* =========================
   ART
========================= */

.album-art{
    width:57px;
    height:57px;

    flex-shrink:0;

    object-fit:cover;

    border-radius:50%;

    box-shadow:
        0 5px 18px rgba(0,0,0,.55);
}

.album-art.playing{
    animation:spin 12s linear infinite;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


/* =========================
   SONG INFORMATION
========================= */

.song-info{
    flex:1;
    min-width:0;
}

.current-title{
    font-size:14px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.current-artist{
    margin-top:4px;

    color:rgba(255,255,255,.6);

    font-size:11px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   PROGRESS
========================= */

.progress{
    width:100%;
    height:4px;

    margin-top:9px;

    background:rgba(255,255,255,.2);

    border-radius:10px;

    cursor:pointer;

    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;

    background:white;

    border-radius:10px;
}

.time{
    display:flex;
    justify-content:space-between;

    margin-top:4px;

    color:rgba(255,255,255,.48);

    font-size:9px;
}


/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;
    align-items:center;

    gap:2px;

    flex-shrink:0;
}

.control{
    width:30px;
    height:38px;

    border:none;

    background:none;

    color:white;

    font-size:15px;

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;
}

.control:active{
    transform:scale(.8);
}

.play{
    width:47px;
    height:47px;

    border:none;

    border-radius:50%;

    background:white;

    color:#000;

    font-size:16px;

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 5px 20px rgba(0,0,0,.45);
}

.play:active{
    transform:scale(.91);
}


/* =========================
   MESSAGE
========================= */

.message{
    position:fixed;

    z-index:100;

    left:50%;
    bottom:185px;

    transform:translateX(-50%);

    max-width:85%;

    padding:9px 15px;

    border-radius:20px;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(15px);

    font-size:11px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.3s;
}

.message.show{
    opacity:1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .song-list{
        left:12px;

        width:
            calc(100% - 190px);

        max-height:
            calc(100vh - 355px);
    }

    .bg-menu{
        right:8px;
    }

    .bg-btn{
        min-width:140px;
        padding:9px 10px;
    }

    .player{
        bottom:58px;
    }

    .album-art{
        width:53px;
        height:53px;
    }

    .play{
        width:44px;
        height:44px;
    }

}

@media(max-width:420px){

    .song-list{
        width:calc(100% - 175px);
    }

    .bg-btn{
        min-width:132px;
        font-size:11px;
    }

    .song-thumb{
        width:38px;
        height:38px;
    }

    .song-title{
        font-size:11px;
    }

    .album-art{
        width:48px;
        height:48px;
    }

    .current-title{
        font-size:12px;
    }

    .control{
        width:25px;
    }

    .play{
        width:41px;
        height:41px;
    }
}

@media(max-width:350px){

    .song-list{
        display:none;
    }

    .bg-menu{
        top:82px;
    }
}
</style>
</head>

<body>


<!-- =========================
     CLOCK / STATUS
========================= -->

<div class="top-bar">

    <div
        class="clock"
        id="clock">
        00:00
    </div>

    <div class="status">

        <span class="status-dot"></span>

        <span>ONLINE MUSIC</span>

    </div>

</div>


<!-- =========================
     BACKGROUNDS
========================= -->

<div class="bg-menu">

    <button
        class="bg-btn active"
        data-bg="0"
        onclick="changeBackground(0)">
        🌊 Ocean
    </button>

    <button
        class="bg-btn"
        data-bg="1"
        onclick="changeBackground(1)">
        🌌 Space
    </button>

    <button
        class="bg-btn"
        data-bg="2"
        onclick="changeBackground(2)">
        🌲 Forest
    </button>

    <button
        class="bg-btn"
        data-bg="3"
        onclick="changeBackground(3)">
        🌃 Night
    </button>

    <button
        class="bg-btn"
        data-bg="4"
        onclick="changeBackground(4)">
        🌅 Sunset
    </button>

    <button
        class="bg-btn"
        onclick="
        document
        .getElementById('backgroundUpload')
        .click()">
        🖼️ My Background
    </button>

    <input
        type="file"
        id="backgroundUpload"
        accept="image/*">

</div>


<!-- =========================
     SONG LIST
========================= -->

<div
    class="song-list"
    id="songList">
</div>


<!-- =========================
     YOUTUBE PLAYER
========================= -->

<div id="youtube-player"></div>


<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <img
        id="albumArt"
        class="album-art"
        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&q=80"
        alt="Album artwork">

    <div class="song-info">

        <div
            class="current-title"
            id="currentTitle">
            Hindi Music
        </div>

        <div
            class="current-artist"
            id="currentArtist">
            Tap a song to play
        </div>

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousTrack()">
            ⏮
        </button>

        <button
            class="play"
            id="playButton"
            onclick="togglePlay()">
            ▶
        </button>

        <button
            class="control"
            onclick="nextTrack()">
            ⏭
        </button>

        <button
            class="control"
            onclick="openCurrentOnYouTube()">
            ↗
        </button>

    </div>

</div>


<div
    class="message"
    id="message">
</div>


<script>

/* =========================================================
   SONGS

   These are YouTube VIDEO IDs.

   You can add more songs by adding another object.

   Format:

   {
       title: "Song name",
       artist: "Artist",
       videoId: "YOUTUBE_VIDEO_ID",
       art: "IMAGE_URL"
   }
========================================================= */

const songs = [

    {
        title: "Chaleya",
        artist: "Arijit Singh & Shilpa Rao",
        videoId: "VAdGW7QDJiU",
        art:
        "https://i.ytimg.com/vi/VAdGW7QDJiU/hqdefault.jpg"
    },

    {
        title: "Apna Bana Le",
        artist: "Arijit Singh",
        videoId: "YALvuUpY_b0",
        art:
        "https://i.ytimg.com/vi/YALvuUpY_b0/hqdefault.jpg"
    },

    {
        title: "Channa Mereya",
        artist: "Arijit Singh",
        videoId: "FO9rBogdRRQ",
        art:
        "https://i.ytimg.com/vi/FO9rBogdRRQ/hqdefault.jpg"
    },

    {
        title: "Kesariya",
        artist: "Arijit Singh",
        videoId: "3HDBRhB045E",
        art:
        "https://i.ytimg.com/vi/3HDBRhB045E/hqdefault.jpg"
    }

];


/* =========================================================
   VARIABLES
========================================================= */

let player = null;

let playerReady = false;

let currentTrack = 0;

let progressTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const songList =
    document.getElementById("songList");

const currentTitle =
    document.getElementById("currentTitle");

const currentArtist =
    document.getElementById("currentArtist");

const albumArt =
    document.getElementById("albumArt");

const playButton =
    document.getElementById("playButton");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const message =
    document.getElementById("message");


/* =========================================================
   RENDER SONG LIST
========================================================= */

function renderSongs(){

    songList.innerHTML = "";

    songs.forEach((song,index)=>{

        const item =
            document.createElement("button");

        item.className =
            "song-item";

        item.innerHTML = `

            <img
                class="song-thumb"
                src="${song.art}"
                alt="">

            <div class="song-text">

                <div class="song-title">
                    ${escapeHTML(song.title)}
                </div>

                <div class="song-artist">
                    ${escapeHTML(song.artist)}
                </div>

            </div>

            <span class="playing-dot"></span>
        `;

        item.onclick =
            () => playSong(index);

        songList.appendChild(item);

    });

    updateActiveSong();
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   UPDATE ACTIVE SONG
========================================================= */

function updateActiveSong(){

    document
    .querySelectorAll(".song-item")
    .forEach((item,index)=>{

        item.classList.toggle(
            "active",
            index === currentTrack &&
            player &&
            playerReady &&
            player.getPlayerState &&
            player.getPlayerState() === YT.PlayerState.PLAYING
        );

    });
}


/* =========================================================
   LOAD YOUTUBE API
========================================================= */

const tag =
    document.createElement("script");

tag.src =
    "https://www.youtube.com/iframe_api";

document
    .head
    .appendChild(tag);


/* =========================================================
   YOUTUBE API READY
========================================================= */

function onYouTubeIframeAPIReady(){

    player =
        new YT.Player(
            "youtube-player",
            {

                width:"200",
                height:"200",

                videoId:
                    songs[0].videoId,

                playerVars:{
                    autoplay:0,
                    controls:0,
                    playsinline:1,
                    rel:0,
                    enablejsapi:1,
                    origin:window.location.origin
                },

                events:{
                    onReady:onPlayerReady,
                    onStateChange:onPlayerStateChange,
                    onError:onPlayerError
                }

            }
        );

}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady(){

    playerReady = true;

    loadSongInformation();

    updateMediaSession();

}


/* =========================================================
   LOAD SONG
========================================================= */

function loadSongInformation(){

    const song =
        songs[currentTrack];

    currentTitle.textContent =
        song.title;

    currentArtist.textContent =
        song.artist;

    albumArt.src =
        song.art;

    currentTime.textContent =
        "0:00";

    duration.textContent =
        "0:00";

    progressFill.style.width =
        "0%";

    updateActiveSong();

    updateMediaSession();

}


/* =========================================================
   PLAY INDIVIDUAL SONG
========================================================= */

function playSong(index){

    currentTrack = index;

    loadSongInformation();

    if(!playerReady){

        showMessage(
            "YouTube player is still loading..."
        );

        return;
    }

    player.loadVideoById(
        songs[currentTrack].videoId
    );

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay(){

    if(!playerReady){

        showMessage(
            "YouTube player is loading..."
        );

        return;
    }

    const state =
        player.getPlayerState();

    if(
        state === YT.PlayerState.PLAYING
    ){

        player.pauseVideo();

    }else{

        player.playVideo();

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextTrack(){

    currentTrack =
        (currentTrack + 1) %
        songs.length;

    loadSongInformation();

    if(playerReady){

        player.loadVideoById(
            songs[currentTrack].videoId
        );

    }

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousTrack(){

    if(
        playerReady &&
        player.getCurrentTime() > 3
    ){

        player.seekTo(
            0,
            true
        );

        return;
    }

    currentTrack =
        (currentTrack - 1 + songs.length)
        % songs.length;

    loadSongInformation();

    if(playerReady){

        player.loadVideoById(
            songs[currentTrack].videoId
        );

    }

}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event){

    if(
        event.data ===
        YT.PlayerState.PLAYING
    ){

        playButton.textContent =
            "❚❚";

        albumArt.classList.add(
            "playing"
        );

        startProgress();

        updateActiveSong();

        if(
            "mediaSession" in navigator
        ){

            navigator.mediaSession.playbackState =
                "playing";

        }

    }


    else if(
        event.data ===
        YT.PlayerState.PAUSED
    ){

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

        stopProgress();

        updateActiveSong();

        if(
            "mediaSession" in navigator
        ){

            navigator.mediaSession.playbackState =
                "paused";

        }

    }


    else if(
        event.data ===
        YT.PlayerState.ENDED
    ){

        stopProgress();

        nextTrack();

    }


    else if(
        event.data ===
        YT.PlayerState.BUFFERING
    ){

        showMessage(
            "Loading music..."
        );

    }

}


/* =========================================================
   YOUTUBE ERROR
========================================================= */

function onPlayerError(event){

    console.log(
        "YouTube player error:",
        event.data
    );

    showMessage(
        "This song cannot be played in the embedded player."
    );

}


/* =========================================================
   PROGRESS
========================================================= */

function startProgress(){

    stopProgress();

    progressTimer =
        setInterval(
            updateProgress,
            500
        );

}


function stopProgress(){

    if(progressTimer){

        clearInterval(
            progressTimer
        );

        progressTimer = null;
    }

}


function updateProgress(){

    if(
        !playerReady ||
        !player.getDuration
    ) return;

    const total =
        player.getDuration();

    const current =
        player.getCurrentTime();

    if(
        !total ||
        !isFinite(total)
    ) return;

    const percent =
        (current / total) * 100;

    progressFill.style.width =
        percent + "%";

    currentTime.textContent =
        formatTime(current);

    duration.textContent =
        formatTime(total);

}


/* =========================================================
   SEEK
========================================================= */

progress.addEventListener(
    "click",
    function(event){

        if(!playerReady) return;

        const total =
            player.getDuration();

        if(!total) return;

        const rect =
            progress.getBoundingClientRect();

        const position =
            event.clientX -
            rect.left;

        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    position / rect.width
                )
            );

        player.seekTo(
            total * percent,
            true
        );

    }
);


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds){

    if(
        !seconds ||
        !isFinite(seconds)
    ){

        return "0:00";
    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2,"0");

    return minutes + ":" + secs;

}


/* =========================================================
   OPEN YOUTUBE
========================================================= */

function openCurrentOnYouTube(){

    if(!songs.length) return;

    const id =
        songs[currentTrack].videoId;

    window.open(
        "https://www.youtube.com/watch?v=" +
        id,
        "_blank"
    );

}


/* =========================================================
   MEDIA SESSION
========================================================= */

function updateMediaSession(){

    if(
        !("mediaSession" in navigator) ||
        !songs.length
    ) return;

    const song =
        songs[currentTrack];

    if(
        "MediaMetadata" in window
    ){

        navigator.mediaSession.metadata =
            new MediaMetadata({

                title:
                    song.title,

                artist:
                    song.artist,

                album:
                    "Music Room",

                artwork:[
                    {
                        src:song.art,
                        sizes:"512x512",
                        type:"image/jpeg"
                    }
                ]

            });

    }

}


/* =========================================================
   MEDIA BUTTONS
========================================================= */

if(
    "mediaSession" in navigator
){

    try{

        navigator.mediaSession.setActionHandler(
            "play",
            () => {

                if(playerReady)
                    player.playVideo();

            }
        );


        navigator.mediaSession.setActionHandler(
            "pause",
            () => {

                if(playerReady)
                    player.pauseVideo();

            }
        );


        navigator.mediaSession.setActionHandler(
            "nexttrack",
            () => nextTrack()
        );


        navigator.mediaSession.setActionHandler(
            "previoustrack",
            () => previousTrack()
        );


        navigator.mediaSession.setActionHandler(
            "seekbackward",
            () => {

                if(playerReady){

                    player.seekTo(
                        Math.max(
                            0,
                            player.getCurrentTime() - 10
                        ),
                        true
                    );

                }

            }
        );


        navigator.mediaSession.setActionHandler(
            "seekforward",
            () => {

                if(playerReady){

                    player.seekTo(
                        Math.min(
                            player.getDuration(),
                            player.getCurrentTime() + 10
                        ),
                        true
                    );

                }

            }
        );

    }catch(error){

        console.log(
            "Media Session unavailable"
        );

    }

}


/* =========================================================
   BACKGROUNDS
========================================================= */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1800&q=85",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1800&q=85",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1800&q=85",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1800&q=85",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1800&q=85"

];


function changeBackground(index){

    document.body.style.backgroundImage =
        `url("${backgrounds[index]}")`;

    localStorage.setItem(
        "musicBackground",
        backgrounds[index]
    );

    document
    .querySelectorAll(
        ".bg-btn[data-bg]"
    )
    .forEach(button=>{

        button.classList.toggle(
            "active",
            Number(button.dataset.bg) === index
        );

    });

}


/* =========================================================
   CUSTOM BACKGROUND
========================================================= */

document
.getElementById("backgroundUpload")
.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file) return;

        if(
            !file.type.startsWith("image/")
        ){

            showMessage(
                "Please select an image."
            );

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                const image =
                    e.target.result;

                document.body.style.backgroundImage =
                    `url("${image}")`;

                try{

                    localStorage.setItem(
                        "customBackground",
                        image
                    );

                }catch(error){

                    console.log(
                        "Image too large for storage."
                    );

                }

            };

        reader.readAsDataURL(file);

    }
);


/* =========================================================
   RESTORE BACKGROUND
========================================================= */

const savedCustom =
    localStorage.getItem(
        "customBackground"
    );

const savedBackground =
    localStorage.getItem(
        "musicBackground"
    );


if(savedCustom){

    document.body.style.backgroundImage =
        `url("${savedCustom}")`;

}
else if(savedBackground){

    document.body.style.backgroundImage =
        `url("${savedBackground}")`;

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

    const now =
        new Date();

    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            ()=>{
                message.classList.remove(
                    "show"
                );
            },
            3000
        );

}


/* =========================================================
   INITIALIZE
========================================================= */

renderSongs();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Music Room</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    min-height: 100vh;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=80")
        center / cover no-repeat fixed;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;

    padding: 16px;

    overflow: hidden;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        background-image .6s ease;
}


/* ================================
   DARK OVERLAY
================================ */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.30),
            rgba(0,0,0,.10),
            rgba(0,0,0,.70)
        );

    z-index: 0;

    pointer-events: none;
}


/* ================================
   TOP BAR
================================ */

.top-bar {

    width: 100%;

    max-width: 480px;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    padding:
        8px 12px;

    position: relative;

    z-index: 10;
}


.clock {

    font-size:
        .9rem;

    font-weight:
        600;
}


.status {

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        6px 12px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:
        20px;

    backdrop-filter:
        blur(12px);

    font-size:
        .72rem;
}


.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background:
        #00ff88;

    box-shadow:
        0 0 8px
        #00ff88;
}


/* ================================
   BACKGROUND MENU
================================ */

.bg-menu {

    position: fixed;

    top: 65px;

    right: 15px;

    display: flex;

    flex-direction:
        column;

    gap: 6px;

    z-index: 20;
}


.bg-btn {

    padding:
        7px 10px;

    border-radius:
        9px;

    border:
        1px solid
        rgba(255,255,255,.18);

    background:
        rgba(0,0,0,.48);

    color:
        white;

    backdrop-filter:
        blur(12px);

    font-size:
        .68rem;

    cursor:
        pointer;

    transition:
        .2s;
}


.bg-btn:hover {

    background:
        rgba(255,255,255,.20);
}


.bg-btn:active {

    transform:
        scale(.94);
}


input[type="file"] {

    display:
        none;
}


/* ================================
   PLAYER
================================ */

.player {

    width: 100%;

    max-width: 460px;

    position:
        relative;

    z-index:
        10;

    margin-bottom:
        25px;

    padding:
        12px 16px;

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    background:
        rgba(25,20,20,.68);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:
        40px;

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.55);
}


/* ================================
   ALBUM ART
================================ */

.album-art {

    width:
        56px;

    height:
        56px;

    flex-shrink:
        0;

    object-fit:
        cover;

    border-radius:
        50%;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.55);

    animation:
        spin 12s linear infinite;

    animation-play-state:
        paused;
}


.album-art.playing {

    animation-play-state:
        running;
}


@keyframes spin {

    from {
        transform:
            rotate(0deg);
    }

    to {
        transform:
            rotate(360deg);
    }
}


/* ================================
   SONG INFORMATION
================================ */

.song-info {

    flex:
        1;

    min-width:
        0;
}


.song-title {

    font-size:
        .9rem;

    font-weight:
        600;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    margin-bottom:
        3px;
}


.song-artist {

    font-size:
        .73rem;

    color:
        #ccc;

    white-space:
        nowrap;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    margin-bottom:
        7px;
}


/* ================================
   PROGRESS
================================ */

.progress {

    width:
        100%;

    height:
        4px;

    background:
        rgba(255,255,255,.20);

    border-radius:
        4px;

    cursor:
        pointer;

    overflow:
        hidden;
}


.progress-fill {

    width:
        0%;

    height:
        100%;

    background:
        white;

    border-radius:
        4px;

    transition:
        width .1s linear;
}


.time {

    display:
        flex;

    justify-content:
        space-between;

    margin-top:
        4px;

    font-size:
        .60rem;

    color:
        #aaa;
}


/* ================================
   CONTROLS
================================ */

.controls {

    display:
        flex;

    align-items:
        center;

    gap:
        6px;

    flex-shrink:
        0;
}


.icon-btn {

    width:
        30px;

    height:
        30px;

    border:
        none;

    background:
        transparent;

    color:
        white;

    font-size:
        15px;

    cursor:
        pointer;

    opacity:
        .85;
}


.icon-btn:hover {

    opacity:
        1;
}


.play-btn {

    width:
        43px;

    height:
        43px;

    border:
        none;

    border-radius:
        50%;

    background:
        white;

    color:
        black;

    font-size:
        15px;

    cursor:
        pointer;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.4);
}


/* ================================
   JAMENDO CREDIT
================================ */

.credit {

    position:
        fixed;

    bottom:
        7px;

    left:
        50%;

    transform:
        translateX(-50%);

    font-size:
        9px;

    color:
        rgba(255,255,255,.55);

    z-index:
        5;

    white-space:
        nowrap;
}


/* ================================
   MOBILE
================================ */

@media(max-width:500px) {

    body {
        padding:
            12px;
    }

    .player {

        padding:
            10px 12px;

        gap:
            8px;
    }

    .album-art {

        width:
            48px;

        height:
            48px;
    }

    .play-btn {

        width:
            40px;

        height:
            40px;
    }

    .controls {

        gap:
            2px;
    }

    .bg-menu {

        right:
            10px;
    }
}

</style>
</head>


<body>


<!-- ================================
     TOP BAR
================================ -->

<div class="top-bar">

    <div
        class="clock"
        id="clock">

        00:00

    </div>


    <div class="status">

        <span class="status-dot"></span>

        <span>
            ONLINE MUSIC
        </span>

    </div>

</div>



<!-- ================================
     BACKGROUND MENU
================================ -->

<div class="bg-menu">

    <button
        class="bg-btn"
        onclick="changeBackground(0)">

        🌊 Ocean

    </button>


    <button
        class="bg-btn"
        onclick="changeBackground(1)">

        🌌 Space

    </button>


    <button
        class="bg-btn"
        onclick="changeBackground(2)">

        🌲 Forest

    </button>


    <button
        class="bg-btn"
        onclick="changeBackground(3)">

        🌃 Night

    </button>


    <button
        class="bg-btn"
        onclick="changeBackground(4)">

        🌅 Sunset

    </button>


    <button
        class="bg-btn"
        onclick="document
        .getElementById('backgroundUpload')
        .click()">

        🖼️ My Background

    </button>


    <input
        id="backgroundUpload"
        type="file"
        accept="image/*"
        onchange="customBackground(event)"
    >

</div>



<!-- ================================
     MUSIC PLAYER
================================ -->

<div class="player">


    <img
        id="albumArt"
        class="album-art"

        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500&q=80"

        alt="Album Art"
    >


    <div class="song-info">


        <div
            class="song-title"
            id="songTitle">

            Loading music...

        </div>


        <div
            class="song-artist"
            id="songArtist">

            Jamendo

        </div>


        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>


        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>



    <div class="controls">


        <button
            class="icon-btn"
            onclick="previousTrack()">

            ⏮

        </button>


        <button
            class="play-btn"
            id="playButton"
            onclick="togglePlay()">

            ▶

        </button>


        <button
            class="icon-btn"
            onclick="nextTrack()">

            ⏭

        </button>


        <button
            class="icon-btn"
            id="volumeButton"
            onclick="toggleMute()">

            🔊

        </button>

    </div>

</div>



<!-- ================================
     AUDIO
================================ -->

<audio
    id="audio"
    preload="metadata"
    playsinline>
</audio>



<div class="credit">

    Music provided through Jamendo API

</div>



<script>

/* ==================================================
   JAMENDO
================================================== */

/*
    TEST CLIENT ID

    Replace this with YOUR Jamendo client_id
    before publishing the final version.
*/

const JAMENDO_CLIENT_ID =
    "709fa152";


/*
    We ask Jamendo for featured music.

    No search box is used.

    You can change the genre later:

    lounge
    electronic
    jazz
    classical
    relaxation
    pop
    rock
    world

    Jamendo documents these as supported
    featured selections.
*/

const API_URL =
    "https://api.jamendo.com/v3.0/tracks/?" +

    "client_id=" +
    encodeURIComponent(JAMENDO_CLIENT_ID) +

    "&format=json" +

    "&limit=30" +

    "&featured=1" +

    "&tags=lounge" +

    "&audioformat=mp32" +

    "&imagesize=300";


/* ==================================================
   ELEMENTS
================================================== */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const volumeButton =
    document.getElementById("volumeButton");

const albumArt =
    document.getElementById("albumArt");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");


let tracks = [];

let currentTrack = 0;


/* ==================================================
   GET MUSIC FROM JAMENDO
================================================== */

async function loadMusic() {

    songTitle.textContent =
        "Loading music...";

    songArtist.textContent =
        "Connecting to Jamendo";


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Jamendo API request failed"
            );

        }


        const data =
            await response.json();


        if (
            !data.results ||
            data.results.length === 0
        ) {

            throw new Error(
                "No tracks returned"
            );

        }


        tracks =
            data.results.filter(
                track =>
                    track.audio
            );


        if (tracks.length === 0) {

            throw new Error(
                "No playable tracks found"
            );

        }


        /*
            Shuffle the tracks so
            visitors don't always hear
            the same order.
        */

        shuffle(tracks);


        currentTrack = 0;

        loadTrack(currentTrack);


    } catch(error) {

        console.error(error);

        songTitle.textContent =
            "Unable to load music";

        songArtist.textContent =
            "Please try again";

    }

}


/* ==================================================
   LOAD TRACK
================================================== */

function loadTrack(index) {

    if (!tracks.length) return;


    const track =
        tracks[index];


    songTitle.textContent =
        track.name ||
        "Unknown Track";


    songArtist.textContent =
        track.artist_name ||
        "Unknown Artist";


    /*
        Jamendo provides an image
        field for tracks.
    */

    if (track.image) {

        albumArt.src =
            track.image;

    }


    /*
        IMPORTANT:

        This is the online audio
        stream returned by Jamendo.

        No MP3 is stored on GitHub.
    */

    audio.src =
        track.audio;


    audio.load();


    progressFill.style.width =
        "0%";


    currentTime.textContent =
        "0:00";


    duration.textContent =
        formatTime(track.duration);

}


/* ==================================================
   PLAY
================================================== */

function togglePlay() {

    if (audio.paused) {

        audio.play()

        .then(() => {

            playButton.textContent =
                "❚❚";

            albumArt.classList.add(
                "playing"
            );

        })

        .catch(error => {

            console.error(error);

            alert(
                "Tap Play again to start the music."
            );

        });

    } else {

        audio.pause();

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

    }

}


/* ==================================================
   NEXT
================================================== */

function nextTrack() {

    if (!tracks.length) return;


    currentTrack++;


    if (
        currentTrack >=
        tracks.length
    ) {

        currentTrack = 0;

    }


    loadTrack(currentTrack);


    audio.play()

    .then(() => {

        playButton.textContent =
            "❚❚";

        albumArt.classList.add(
            "playing"
        );

    })

    .catch(console.error);

}


/* ==================================================
   PREVIOUS
================================================== */

function previousTrack() {

    if (!tracks.length) return;


    currentTrack--;


    if (currentTrack < 0) {

        currentTrack =
            tracks.length - 1;

    }


    loadTrack(currentTrack);


    audio.play()

    .then(() => {

        playButton.textContent =
            "❚❚";

        albumArt.classList.add(
            "playing"
        );

    })

    .catch(console.error);

}


/* ==================================================
   AUTOMATIC NEXT SONG
================================================== */

audio.addEventListener(
    "ended",
    () => {

        nextTrack();

    }
);


/* ==================================================
   PROGRESS
================================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration)
            return;


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* ==================================================
   DURATION
================================================== */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* ==================================================
   SEEK
================================================== */

progress.addEventListener(
    "click",
    event => {

        if (!audio.duration)
            return;


        const rect =
            progress.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percentage =
            position /
            rect.width;


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* ==================================================
   TIME FORMAT
================================================== */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* ==================================================
   MUTE
================================================== */

function toggleMute() {

    audio.muted =
        !audio.muted;


    volumeButton.textContent =
        audio.muted
        ? "🔇"
        : "🔊";

}


/* ==================================================
   SHUFFLE
================================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* ==================================================
   BACKGROUNDS
================================================== */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=80",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600&q=80",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600&q=80",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600&q=80"

];


function changeBackground(index) {

    document.body.style.backgroundImage =
        `url("${backgrounds[index]}")`;


    localStorage.setItem(
        "selectedBackground",
        backgrounds[index]
    );

}


/* ==================================================
   CUSTOM BACKGROUND
================================================== */

function customBackground(event) {

    const file =
        event.target.files[0];


    if (!file)
        return;


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const image =
                event.target.result;


            document.body.style.backgroundImage =
                `url("${image}")`;


            localStorage.setItem(
                "customBackground",
                image
            );

        };


    reader.readAsDataURL(file);

}


/* ==================================================
   RESTORE BACKGROUND
================================================== */

const savedCustomBackground =
    localStorage.getItem(
        "customBackground"
    );


const savedBackground =
    localStorage.getItem(
        "selectedBackground"
    );


if (savedCustomBackground) {

    document.body.style.backgroundImage =
        `url("${savedCustomBackground}")`;

} else if (savedBackground) {

    document.body.style.backgroundImage =
        `url("${savedBackground}")`;

}


/* ==================================================
   CLOCK
================================================== */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =

        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* ==================================================
   START
================================================== */

loadMusic();

</script>

</body>
</html>

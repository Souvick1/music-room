<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Music Room</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=85")
        center / cover no-repeat fixed;

    transition: background-image .5s ease;
}

/* Background overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.18),
            rgba(0,0,0,.08) 40%,
            rgba(0,0,0,.76)
        );

    z-index: 0;
    pointer-events: none;
}


/* =========================
   CLOCK
========================= */

.top-bar {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 520px;

    margin: auto;

    padding: 42px 18px 0;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.clock {
    font-size: 28px;
    font-weight: 600;

    text-shadow:
        0 2px 12px rgba(0,0,0,.5);
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 9px 15px;

    background:
        rgba(0,0,0,.45);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 30px;

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow:
        0 0 10px #00ff88;
}


/* =========================
   BACKGROUND MENU
========================= */

.bg-menu {
    position: fixed;
    z-index: 30;

    top: 105px;
    right: 12px;

    display: flex;
    flex-direction: column;

    gap: 7px;
}

.bg-btn {
    min-width: 165px;

    padding: 9px 13px;

    border:
        1px solid
        rgba(255,255,255,.17);

    border-radius: 13px;

    color: white;

    background:
        rgba(0,0,0,.48);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    font-size: 13px;

    cursor: pointer;

    transition: .2s;
}

.bg-btn:hover {
    background:
        rgba(255,255,255,.18);
}

.bg-btn:active {
    transform: scale(.95);
}

.bg-btn.active {
    background:
        rgba(255,255,255,.22);
}

input[type="file"] {
    display: none;
}


/* =====================================================
   HIDDEN YOUTUBE PLAYER
===================================================== */

/*
   The official YouTube iframe is kept inside this
   container.

   It is NOT replaced with a fake audio stream.
*/

.youtube-container {
    position: fixed;

    width: 320px;
    height: 180px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 5;

    opacity: 0.01;

    pointer-events: none;

    overflow: hidden;
}


/* =========================
   PLAYER BAR
========================= */

.player {
    position: fixed;

    z-index: 40;

    left: 50%;
    bottom: 85px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 20px);

    max-width: 480px;

    min-height: 104px;

    padding:
        11px 13px;

    display: flex;

    align-items: center;

    gap: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(22,20,28,.86),
            rgba(8,8,12,.74)
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 38px;

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.08);
}


/* =========================
   ALBUM ART
========================= */

.album-art {
    width: 56px;
    height: 56px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    background: #222;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.55);
}

.album-art.playing {
    animation:
        spin 12s linear infinite;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================
   SONG INFORMATION
========================= */

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 14px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.song-artist {
    margin-top: 4px;

    font-size: 11px;

    color:
        rgba(255,255,255,.62);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================
   PROGRESS
========================= */

.progress {
    width: 100%;
    height: 4px;

    margin-top: 9px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.18);

    overflow: hidden;

    cursor: pointer;
}

.progress-fill {
    width: 0%;

    height: 100%;

    border-radius: 10px;

    background: white;

    transition:
        width .15s linear;
}

.time {
    display: flex;

    justify-content:
        space-between;

    margin-top: 4px;

    color:
        rgba(255,255,255,.52);

    font-size: 9px;
}


/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;

    align-items: center;

    gap: 2px;

    flex-shrink: 0;
}

.control {
    width: 30px;
    height: 32px;

    border: none;

    background: transparent;

    color: white;

    font-size: 15px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}

.control:active {
    transform: scale(.88);
}

.play {
    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 16px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);
}

.play:active {
    transform: scale(.92);
}


/* =========================
   MESSAGE
========================= */

.message {
    position: fixed;

    z-index: 50;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    padding:
        8px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.58);

    backdrop-filter:
        blur(12px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .3s;
}

.message.show {
    opacity: 1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px) {

    .top-bar {
        padding-top: 42px;
    }

    .clock {
        font-size: 27px;
    }

    .status {
        font-size: 11px;
        padding: 8px 12px;
    }

    .bg-menu {
        top: 103px;
        right: 9px;
    }

    .bg-btn {
        min-width: 155px;
        font-size: 12px;
        padding: 9px 11px;
    }

    .player {
        bottom: 85px;
        width:
            calc(100% - 18px);
    }

    .album-art {
        width: 52px;
        height: 52px;
    }

    .play {
        width: 44px;
        height: 44px;
    }
}

@media(max-width:370px) {

    .player {
        bottom: 70px;
    }

    .album-art {
        width: 47px;
        height: 47px;
    }

    .control {
        width: 26px;
    }

    .play {
        width: 41px;
        height: 41px;
    }
}

</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="top-bar">

    <div
        class="clock"
        id="clock">
        00:00
    </div>

    <div class="status">

        <span class="status-dot"></span>

        <span>
            HINDI MUSIC
        </span>

    </div>

</div>


<!-- =========================
     BACKGROUND MENU
========================= -->

<div class="bg-menu">

    <button
        class="bg-btn"
        data-bg="0"
        onclick="changeBackground(0)">
        🌊 Ocean
    </button>

    <button
        class="bg-btn"
        data-bg="1"
        onclick="changeBackground(1)">
        🌌 Space
    </button>

    <button
        class="bg-btn"
        data-bg="2"
        onclick="changeBackground(2)">
        🌲 Forest
    </button>

    <button
        class="bg-btn"
        data-bg="3"
        onclick="changeBackground(3)">
        🌃 Night
    </button>

    <button
        class="bg-btn"
        data-bg="4"
        onclick="changeBackground(4)">
        🌅 Sunset
    </button>

    <button
        class="bg-btn"
        onclick="document
        .getElementById('backgroundUpload')
        .click()">
        🖼️ My Background
    </button>

    <input
        type="file"
        id="backgroundUpload"
        accept="image/*"
        onchange="customBackground(event)">

</div>


<!-- =====================================================
     OFFICIAL YOUTUBE IFRAME PLAYER
===================================================== -->

<div
    class="youtube-container"
    id="youtube-container">

    <div id="youtube-player"></div>

</div>


<!-- =========================
     CUSTOM PLAYER
========================= -->

<div class="player">

    <img
        id="albumArt"
        class="album-art"

        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&q=80"

        alt="Music">

    <div class="song-info">

        <div
            class="song-title"
            id="songTitle">

            Hindi Music

        </div>

        <div
            class="song-artist"
            id="songArtist">

            Tap Play to start

        </div>

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousTrack()"
            aria-label="Previous">
            ⏮
        </button>

        <button
            class="play"
            id="playButton"
            onclick="togglePlay()"
            aria-label="Play">
            ▶
        </button>

        <button
            class="control"
            onclick="nextTrack()"
            aria-label="Next">
            ⏭
        </button>

        <button
            class="control"
            id="volumeButton"
            onclick="toggleMute()"
            aria-label="Volume">
            🔊
        </button>

    </div>

</div>


<div
    class="message"
    id="message">
    Loading...
</div>


<!-- =====================================================
     YOUTUBE IFRAME PLAYER API
===================================================== -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   YOUTUBE PLAYLIST
===================================================== */

/*
   Replace this playlist ID if you want another
   Hindi/Bollywood playlist.

   This is a playlist ID, NOT a video ID.
*/

const YOUTUBE_PLAYLIST_ID =
    "PLo7WLtfSrhdYYdAM4UWSaUy4xG7_GZqXD";


/* =====================================================
   GLOBALS
===================================================== */

let player = null;

let playerReady = false;

let progressTimer = null;

let currentPlaylistIndex = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const albumArt =
    document.getElementById(
        "albumArt"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const songArtist =
    document.getElementById(
        "songArtist"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const volumeButton =
    document.getElementById(
        "volumeButton"
    );

const progress =
    document.getElementById(
        "progress"
    );

const progressFill =
    document.getElementById(
        "progressFill"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );

const duration =
    document.getElementById(
        "duration"
    );

const message =
    document.getElementById(
        "message"
    );


/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            "youtube-player",
            {

                width: "320",

                height: "180",

                playerVars: {

                    autoplay: 0,

                    controls: 1,

                    playsinline: 1,

                    rel: 0,

                    listType:
                        "playlist",

                    list:
                        YOUTUBE_PLAYLIST_ID

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange,

                    onError:
                        onPlayerError

                }

            }
        );

}


/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady(event) {

    playerReady = true;

    /*
       Load the playlist.

       We don't autoplay because browsers generally
       require user interaction for playback.
    */

    player.cuePlaylist({

        list:
            YOUTUBE_PLAYLIST_ID,

        listType:
            "playlist",

        index: 0

    });


    /*
       Shuffle the playlist so the music doesn't
       always start at the same song.
    */

    try {

        player.setShuffle(true);

    } catch(error) {

        console.log(
            "Shuffle unavailable"
        );

    }


    showMessage(
        "Tap ▶ to start Hindi music"
    );


    setTimeout(
        hideMessage,
        2500
    );

}


/* =====================================================
   STATE CHANGE
===================================================== */

function onPlayerStateChange(event) {

    /*
       PLAYING = 1
    */

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        playButton.textContent =
            "❚❚";

        albumArt.classList.add(
            "playing"
        );

        startProgress();

        updateSongInfo();

    }


    /*
       PAUSED = 2
    */

    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

        stopProgress();

    }


    /*
       ENDED = 0
    */

    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

        stopProgress();

        /*
           The playlist itself handles the next
           video. We refresh our information.
        */

        setTimeout(
            updateSongInfo,
            500
        );

    }

}


/* =====================================================
   PLAYER ERROR
===================================================== */

function onPlayerError(event) {

    console.error(
        "YouTube Player Error:",
        event.data
    );


    /*
       Error 150 / 101 generally means that the
       video cannot be embedded.

       Move to the next video instead of breaking
       the whole player.
    */

    if (
        event.data === 101 ||
        event.data === 150 ||
        event.data === 100
    ) {

        showMessage(
            "Skipping unavailable video..."
        );


        setTimeout(
            function() {

                if (
                    player &&
                    playerReady
                ) {

                    player.nextVideo();

                }

            },
            800
        );

    }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay() {

    if (
        !player ||
        !playerReady
    ) {

        showMessage(
            "YouTube player is loading..."
        );

        return;

    }


    const state =
        player.getPlayerState();


    if (
        state ===
        YT.PlayerState.PLAYING
    ) {

        player.pauseVideo();

    } else {

        /*
           This call occurs from the user's
           button tap, so it satisfies normal
           browser playback requirements.
        */

        player.playVideo();

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextTrack() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    player.nextVideo();

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousTrack() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    player.previousVideo();

}


/* =====================================================
   MUTE
===================================================== */

function toggleMute() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    if (
        player.isMuted()
    ) {

        player.unMute();

        volumeButton.textContent =
            "🔊";

    } else {

        player.mute();

        volumeButton.textContent =
            "🔇";

    }

}


/* =====================================================
   PROGRESS UPDATE
===================================================== */

function startProgress() {

    stopProgress();


    progressTimer =
        setInterval(
            updateProgress,
            250
        );

}


function stopProgress() {

    if (
        progressTimer
    ) {

        clearInterval(
            progressTimer
        );

        progressTimer = null;

    }

}


function updateProgress() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    const current =
        player.getCurrentTime();


    const total =
        player.getDuration();


    if (
        !total ||
        !isFinite(total)
    ) {

        return;

    }


    const percentage =
        (
            current /
            total
        ) * 100;


    progressFill.style.width =
        percentage + "%";


    currentTime.textContent =
        formatTime(
            current
        );


    duration.textContent =
        formatTime(
            total
        );

}


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "click",
    function(event) {

        if (
            !player ||
            !playerReady
        ) {

            return;

        }


        const total =
            player.getDuration();


        if (
            !total ||
            !isFinite(total)
        ) {

            return;

        }


        const rect =
            progress.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    position /
                    rect.width
                )
            );


        player.seekTo(
            total * percent,
            true
        );

    }
);


/* =====================================================
   SONG INFORMATION
===================================================== */

function updateSongInfo() {

    if (
        !player ||
        !playerReady
    ) {

        return;

    }


    try {

        const data =
            player.getVideoData();


        if (
            data &&
            data.title
        ) {

            songTitle.textContent =
                data.title;

        }


        if (
            data &&
            data.author
        ) {

            songArtist.textContent =
                data.author;

        }


        /*
           YouTube thumbnail.

           This works for normal YouTube videos.
        */

        if (
            data &&
            data.video_id
        ) {

            albumArt.src =
                "https://i.ytimg.com/vi/" +
                data.video_id +
                "/hqdefault.jpg";

        }

    } catch(error) {

        console.log(
            "Could not update metadata",
            error
        );

    }

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

}


function hideMessage() {

    message.classList.remove(
        "show"
    );

}


/* =====================================================
   BACKGROUNDS
===================================================== */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=85",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600&q=85",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=85",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600&q=85",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600&q=85"

];


function changeBackground(index) {

    const image =
        backgrounds[index];


    document.body.style.backgroundImage =
        `url("${image}")`;


    localStorage.setItem(
        "musicRoomBackground",
        image
    );


    document
        .querySelectorAll(
            ".bg-btn[data-bg]"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    Number(
                        button.dataset.bg
                    ) === index
                );

            }
        );

}


/* =====================================================
   CUSTOM BACKGROUND
===================================================== */

function customBackground(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const image =
                e.target.result;


            document.body.style.backgroundImage =
                `url("${image}")`;


            try {

                localStorage.setItem(
                    "musicRoomCustomBackground",
                    image
                );

            } catch(error) {

                console.warn(
                    "Could not save custom background."
                );

            }

        };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   RESTORE BACKGROUND
===================================================== */

const savedCustomBackground =
    localStorage.getItem(
        "musicRoomCustomBackground"
    );


const savedBackground =
    localStorage.getItem(
        "musicRoomBackground"
    );


if (
    savedCustomBackground
) {

    document.body.style.backgroundImage =
        `url("${savedCustomBackground}")`;

} else if (
    savedBackground
) {

    document.body.style.backgroundImage =
        `url("${savedBackground}")`;

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);

</script>

</body>
</html>

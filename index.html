<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deluxe Saloon Audio Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { height: 100vh; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: background 0.5s ease; color: white; overflow: hidden; }
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 1; }
    
    .card { position: relative; z-index: 2; width: 90%; max-width: 360px; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
    
    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; background: rgba(0, 0, 0, 0.5); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
    .dot { width: 7px; height: 7px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; }
    
    .art { width: 180px; height: 180px; margin: 0 auto 16px; border-radius: 20px; object-fit: cover; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
    
    .title { font-size: 1.15rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; }
    
    /* Custom Saloon Style Player Controls */
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .ctrl-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: white; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s ease; }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.05); }
    .ctrl-btn.play { width: 58px; height: 58px; background: white; color: black; font-size: 1.4rem; border: none; }
    .ctrl-btn.play:hover { background: #e0e0e0; }

    .volume-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
    .volume-box span { font-size: 0.85rem; color: #aaa; }
    .volume-slider { -webkit-appearance: none; width: 100px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); outline: none; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: white; cursor: pointer; }

    .section-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; }
    .bg-selector { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); color: white; padding: 6px 10px; border-radius: 10px; font-size: 0.75rem; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: rgba(255, 255, 255, 0.25); }
    input[type="file"] { display: none; }
    
    /* Hidden YouTube Player Frame */
    #yt-player-container { display: none; }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="card">
    <div class="status"><span class="dot"></span> <span id="onlineCount">32 online</span></div>
    
    <img id="cover" class="art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80" alt="Cover">
    
    <div class="title" id="songTitle">Mujhse Mohabbat Ka Izhaar</div>
    <div class="artist" id="artistName">Satrang Music Official</div>

    <!-- Saloon-Style Control Buttons -->
    <div class="player-controls">
      <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextTrack()" title="Next Track">⏭</button>
    </div>

    <!-- Volume Control -->
    <div class="volume-box">
      <span>🔈</span>
      <input type="range" class="volume-slider" min="0" max="100" value="80" oninput="setVolume(this.value)">
      <span>🔊</span>
    </div>

    <div class="section-label">Select Background</div>
    <div class="bg-selector">
      <button class="btn" onclick="setBg('preset1')">🌌 Midnight</button>
      <button class="btn" onclick="setBg('preset2')">🌆 Neon</button>
      <button class="btn" onclick="setBg('preset3')">🌊 Ocean</button>
      <button class="btn" onclick="setBg('preset4')">🌲 Forest</button>
      <button class="btn" onclick="setBg('preset5')">🌠 Cosmic</button>
      <label class="btn" for="customBg">🖼️ Custom</label>
      <input type="file" id="customBg" accept="image/*" onchange="uploadBg(event)">
    </div>
  </div>

  <!-- Embedded Stream Driver -->
  <div id="yt-player-container">
    <div id="player"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 90s Songs Playlist (YouTube Video IDs)
    const playlist = [
      {
        title: "Mujhse Mohabbat Ka Izhaar",
        artist: "Satrang Music Official",
        id: "PL4fGSI1pDJn6O1FgjS867vwS_rK3w02H6", // 90s Playlist ID
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&q=80"
      },
      {
        title: "90s Romantic Melodies",
        artist: "Kumar Sanu & Alka Yagnik",
        id: "pFE-U2o9_N8",
        cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80"
      },
      {
        title: "Evergreen 90s Hits",
        artist: "Udit Narayan Classics",
        id: "4920_e-4yTo",
        cover: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500&q=80"
      }
    ];

    let currentTrack = 0;
    let ytPlayer;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'pFE-U2o9_N8',
        playerVars: { 'autoplay': 0, 'controls': 0 },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function togglePlay() {
      if (!ytPlayer) return;
      const playBtn = document.getElementById('playBtn');
      if (isPlaying) {
        ytPlayer.pauseVideo();
        playBtn.innerText = '▶';
        isPlaying = false;
      } else {
        ytPlayer.playVideo();
        playBtn.innerText = '⏸';
        isPlaying = true;
      }
    }

    function nextTrack() {
      currentTrack = (currentTrack + 1) % playlist.length;
      const track = playlist[currentTrack];
      
      document.getElementById('songTitle').innerText = track.title;
      document.getElementById('artistName').innerText = track.artist;
      document.getElementById('cover').src = track.cover;

      if (ytPlayer) {
        ytPlayer.loadVideoById(track.id);
        document.getElementById('playBtn').innerText = '⏸';
        isPlaying = true;
      }
    }

    function setVolume(val) {
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      }
    }

    // Background Management
    const bgs = {
      preset1: 'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=1600&q=80',
      preset2: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1600&q=80',
      preset3: 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=80',
      preset4: 'https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=80',
      preset5: 'https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=1600&q=80'
    };

    function setBg(key) {
      document.body.style.backgroundImage = `url('${bgs[key]}')`;
      localStorage.setItem('savedBg', bgs[key]);
    }

    function uploadBg(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.body.style.backgroundImage = `url('${evt.target.result}')`;
          localStorage.setItem('savedBg', evt.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    const saved = localStorage.getItem('savedBg');
    if (saved) {
      document.body.style.backgroundImage = `url('${saved}')`;
    } else {
      setBg('preset1');
    }

    setInterval(() => {
      const count = Math.floor(Math.random() * 8) + 28;
      document.getElementById('onlineCount').innerText = `${count} online`;
    }, 4000);
  </script>
</body>
</html>

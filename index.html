<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<meta name="theme-color" content="#0b0d12">

<title>Music Room</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    min-height: 100vh;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    background:
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=85")
        center center / cover no-repeat fixed;

    transition:
        background-image .5s ease;

}

/* Dark cinematic overlay */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.20) 0%,
            rgba(0,0,0,.08) 40%,
            rgba(0,0,0,.72) 100%
        );

    z-index: 0;

    pointer-events: none;

}


/* =========================
   TOP BAR
========================= */

.top-bar {

    position: relative;

    z-index: 10;

    width: 100%;

    max-width: 520px;

    margin: 0 auto;

    padding:
        48px
        18px
        0;

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

}

.clock {

    font-size: 28px;

    font-weight: 600;

    letter-spacing: -.5px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.4);

}

.status {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        10px
        16px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 30px;

    background:
        rgba(10,10,14,.48);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    font-size: 14px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.22);

}

.status-dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background: #00ff88;

    box-shadow:
        0 0 12px
        #00ff88;

}


/* =========================
   BACKGROUND MENU
========================= */

.bg-menu {

    position: fixed;

    z-index: 20;

    top: 105px;

    right: 12px;

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.bg-btn {

    min-width: 170px;

    padding:
        11px
        14px;

    color: white;

    font-size: 14px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 15px;

    background:
        rgba(15,15,20,.55);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    cursor: pointer;

    transition:
        transform .15s ease,
        background .2s ease;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.22);

}

.bg-btn:hover {

    background:
        rgba(255,255,255,.18);

}

.bg-btn:active {

    transform:
        scale(.96);

}

.bg-btn.active {

    background:
        rgba(255,255,255,.25);

}

input[type="file"] {

    display: none;

}


/* =========================
   PLAYER
========================= */

.player {

    position: fixed;

    z-index: 30;

    left: 50%;

    bottom: 85px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 24px);

    max-width: 480px;

    min-height: 105px;

    padding:
        12px
        14px;

    display: flex;

    align-items: center;

    gap: 11px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 38px;

    background:
        linear-gradient(
            135deg,
            rgba(20,18,25,.84),
            rgba(10,10,15,.72)
        );

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:

        0 20px 60px
        rgba(0,0,0,.65),

        inset 0 1px 0
        rgba(255,255,255,.08);

}


/* =========================
   ALBUM ART
========================= */

.album-art {

    width: 58px;

    height: 58px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 50%;

    background: #222;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.55);

}

.album-art.playing {

    animation:
        spin 12s linear infinite;

}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================
   SONG DETAILS
========================= */

.song-info {

    flex: 1;

    min-width: 0;

}

.song-title {

    font-size: 14px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}

.song-artist {

    margin-top: 4px;

    font-size: 11px;

    color:
        rgba(255,255,255,.65);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   PROGRESS
========================= */

.progress {

    width: 100%;

    height: 4px;

    margin-top: 9px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.20);

    cursor: pointer;

    overflow: hidden;

}

.progress-fill {

    width: 0%;

    height: 100%;

    border-radius: 10px;

    background: white;

    transition:
        width .1s linear;

}

.time {

    display: flex;

    justify-content:
        space-between;

    margin-top: 4px;

    color:
        rgba(255,255,255,.55);

    font-size: 9px;

}


/* =========================
   CONTROLS
========================= */

.controls {

    display: flex;

    align-items: center;

    gap: 3px;

    flex-shrink: 0;

}

.control {

    width: 32px;

    height: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: none;

    background: transparent;

    color: white;

    font-size: 15px;

    cursor: pointer;

}

.control:active {

    transform:
        scale(.88);

}

.play {

    width: 48px;

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: none;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);

}

.play:active {

    transform:
        scale(.92);

}


/* =========================
   LOADING
========================= */

.loading {

    position: fixed;

    z-index: 40;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%);

    padding:
        8px
        15px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.60);

    backdrop-filter:
        blur(12px);

    font-size: 11px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s;

}

.loading.show {

    opacity: 1;

}


/* =========================
   MOBILE
========================= */

@media(max-width:520px) {

    .top-bar {

        padding-top: 43px;

    }

    .clock {

        font-size: 27px;

    }

    .status {

        padding:
            9px
            13px;

        font-size: 13px;

    }

    .bg-menu {

        top: 105px;

        right: 10px;

    }

    .bg-btn {

        min-width: 165px;

        padding:
            10px
            13px;

        font-size: 14px;

    }

    .player {

        bottom: 85px;

        width:
            calc(100% - 20px);

        padding:
            11px
            12px;

        gap: 9px;

    }

    .album-art {

        width: 54px;

        height: 54px;

    }

    .song-title {

        font-size: 14px;

    }

    .play {

        width: 45px;

        height: 45px;

    }

}


/* Smaller phones */

@media(max-width:370px) {

    .bg-menu {

        transform:
            scale(.90);

        transform-origin:
            top right;

    }

    .player {

        bottom: 72px;

    }

    .album-art {

        width: 48px;

        height: 48px;

    }

    .control {

        width: 27px;

    }

    .play {

        width: 42px;

        height: 42px;

    }

}

</style>
</head>


<body>


<!-- =========================
     TOP
========================= -->

<div class="top-bar">

    <div
        class="clock"
        id="clock">
        00:00
    </div>

    <div class="status">

        <span
            class="status-dot">
        </span>

        <span>
            ONLINE MUSIC
        </span>

    </div>

</div>


<!-- =========================
     BACKGROUND BUTTONS
========================= -->

<div class="bg-menu">

    <button
        class="bg-btn"
        data-bg="0"
        onclick="changeBackground(0)">
        🌊 Ocean
    </button>

    <button
        class="bg-btn"
        data-bg="1"
        onclick="changeBackground(1)">
        🌌 Space
    </button>

    <button
        class="bg-btn"
        data-bg="2"
        onclick="changeBackground(2)">
        🌲 Forest
    </button>

    <button
        class="bg-btn"
        data-bg="3"
        onclick="changeBackground(3)">
        🌃 Night
    </button>

    <button
        class="bg-btn"
        data-bg="4"
        onclick="changeBackground(4)">
        🌅 Sunset
    </button>

    <button
        class="bg-btn"
        onclick="document
        .getElementById('backgroundUpload')
        .click()">
        🖼️ My Background
    </button>

    <input
        type="file"
        id="backgroundUpload"
        accept="image/*"
        onchange="customBackground(event)">

</div>


<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <img
        id="albumArt"
        class="album-art"

        src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&q=80"

        alt="Album">

    <div class="song-info">

        <div
            id="songTitle"
            class="song-title">

            Loading music...

        </div>

        <div
            id="songArtist"
            class="song-artist">

            Connecting to Jamendo...

        </div>

        <div
            class="progress"
            id="progress">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">

        <button
            class="control"
            onclick="previousTrack()"
            aria-label="Previous">
            ⏮
        </button>

        <button
            class="play"
            id="playButton"
            onclick="togglePlay()"
            aria-label="Play">
            ▶
        </button>

        <button
            class="control"
            onclick="nextTrack()"
            aria-label="Next">
            ⏭
        </button>

        <button
            class="control"
            id="volumeButton"
            onclick="toggleMute()"
            aria-label="Mute">
            🔊
        </button>

    </div>

</div>


<audio
    id="audio"
    preload="metadata"
    playsinline>
</audio>


<div
    id="loading"
    class="loading">
    Loading music...
</div>


<script>

/* =====================================================
   JAMENDO
===================================================== */

/*
   YOUR JAMENDO CLIENT ID

   Never put your Client Secret here.
*/

const JAMENDO_CLIENT_ID =
    "64b7bde3";


const JAMENDO_API =
    "https://api.jamendo.com/v3.0/tracks/";


/*
   Multiple queries are used.

   If one Jamendo filter happens to return
   zero results, the next one is tried.
*/

const MUSIC_QUERIES = [

    {
        featured: "1",
        tags: "lounge"
    },

    {
        featured: "1",
        tags: "electronic"
    },

    {
        featured: "1",
        tags: "relaxation"
    },

    {
        featured: "1",
        tags: "pop"
    },

    {
        fuzzytags: "chill+ambient"
    },

    {
        fuzzytags: "electronic+relaxation"
    },

    {}

];


let tracks = [];

let currentTrack = 0;

let queryIndex = 0;

let requestNumber = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("audio");

const albumArt =
    document.getElementById("albumArt");

const songTitle =
    document.getElementById("songTitle");

const songArtist =
    document.getElementById("songArtist");

const playButton =
    document.getElementById("playButton");

const volumeButton =
    document.getElementById("volumeButton");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const loading =
    document.getElementById("loading");


/* =====================================================
   LOADING
===================================================== */

function showLoading(message) {

    loading.textContent =
        message;

    loading.classList.add(
        "show"
    );

}


function hideLoading() {

    loading.classList.remove(
        "show"
    );

}


/* =====================================================
   LOAD JAMENDO TRACKS
===================================================== */

function loadJamendoTracks() {

    queryIndex = 0;

    requestTracks();

}


function requestTracks() {

    if (
        queryIndex >=
        MUSIC_QUERIES.length
    ) {

        showError(
            "Jamendo did not return playable tracks."
        );

        return;

    }


    showLoading(
        "Finding music..."
    );


    const query =
        MUSIC_QUERIES[
            queryIndex
        ];


    queryIndex++;


    requestNumber++;


    const callbackName =
        "jamendoCallback_" +
        requestNumber;


    /*
       JSONP callback.

       Jamendo supports JSONP for GET
       requests.
    */

    window[callbackName] =
        function(data) {

            cleanup();

            try {

                if (
                    !data ||
                    !data.results
                ) {

                    throw new Error(
                        "Invalid Jamendo response"
                    );

                }


                const results =
                    data.results.filter(
                        track => {

                            return (
                                track &&
                                track.id &&
                                track.audio
                            );

                        }
                    );


                if (
                    results.length === 0
                ) {

                    /*
                       Try the next query.
                    */

                    requestTracks();

                    return;

                }


                tracks =
                    results;


                shuffle(tracks);


                currentTrack = 0;


                loadTrack(
                    currentTrack
                );


                hideLoading();


                songArtist.textContent =
                    tracks[0].artist_name ||
                    "Jamendo Artist";


            } catch(error) {

                console.error(
                    error
                );

                requestTracks();

            }

        };


    function cleanup() {

        delete window[
            callbackName
        ];

        if (script.parentNode) {

            script.parentNode
                .removeChild(script);

        }

    }


    const script =
        document.createElement(
            "script"
        );


    const params =
        new URLSearchParams();


    params.set(
        "client_id",
        JAMENDO_CLIENT_ID
    );

    params.set(
        "format",
        "json"
    );

    params.set(
        "callback",
        callbackName
    );

    params.set(
        "limit",
        "50"
    );

    params.set(
        "audioformat",
        "mp32"
    );

    params.set(
        "imagesize",
        "300"
    );

    params.set(
        "type",
        "albumtrack"
    );


    /*
       Add current query parameters.
    */

    Object.keys(query)
        .forEach(key => {

            params.set(
                key,
                query[key]
            );

        });


    script.src =
        JAMENDO_API +
        "?" +
        params.toString();


    script.onerror =
        function() {

            cleanup();

            requestTracks();

        };


    document.body.appendChild(
        script
    );

}


/* =====================================================
   LOAD ONE TRACK
===================================================== */

function loadTrack(index) {

    if (
        !tracks.length
    ) {

        return;

    }


    const track =
        tracks[index];


    songTitle.textContent =
        track.name ||
        "Unknown Track";


    songArtist.textContent =
        track.artist_name ||
        "Jamendo Artist";


    /*
       Jamendo's /tracks endpoint returns
       the stream URL in the "audio" field.

       This is the URL we give directly
       to the HTML5 audio player.
    */

    if (track.audio) {

        audio.src =
            track.audio;

    } else {

        /*
           Safety fallback:
           use Jamendo's documented
           /tracks/file streaming endpoint.
        */

        audio.src =
            "https://api.jamendo.com/v3.0/tracks/file/" +
            "?client_id=" +
            encodeURIComponent(
                JAMENDO_CLIENT_ID
            ) +
            "&id=" +
            encodeURIComponent(
                track.id
            ) +
            "&action=stream" +
            "&audioformat=mp32";

    }


    if (track.image) {

        albumArt.src =
            track.image;

    } else if (
        track.album_image
    ) {

        albumArt.src =
            track.album_image;

    }


    progressFill.style.width =
        "0%";


    currentTime.textContent =
        "0:00";


    duration.textContent =
        formatTime(
            Number(
                track.duration
            )
        );


    playButton.textContent =
        "▶";

    albumArt.classList.remove(
        "playing"
    );


    audio.load();

}


/* =====================================================
   PLAY
===================================================== */

function playMusic() {

    if (
        !audio.src
    ) {

        return;

    }


    showLoading(
        "Starting music..."
    );


    const promise =
        audio.play();


    if (
        promise &&
        typeof promise.then ===
        "function"
    ) {

        promise
            .then(() => {

                hideLoading();

                playButton.textContent =
                    "❚❚";

                albumArt.classList.add(
                    "playing"
                );

            })
            .catch(error => {

                console.error(
                    "Playback failed:",
                    error
                );

                hideLoading();

                playButton.textContent =
                    "▶";

                songArtist.textContent =
                    "Tap Play to start music";

            });

    }

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay() {

    if (
        audio.paused
    ) {

        playMusic();

    } else {

        audio.pause();

        playButton.textContent =
            "▶";

        albumArt.classList.remove(
            "playing"
        );

    }

}


/* =====================================================
   NEXT
===================================================== */

function nextTrack(
    autoplay = true
) {

    if (
        !tracks.length
    ) {

        return;

    }


    currentTrack++;


    if (
        currentTrack >=
        tracks.length
    ) {

        shuffle(tracks);

        currentTrack = 0;

    }


    loadTrack(
        currentTrack
    );


    if (autoplay) {

        /*
           Give the browser a moment to
           load the new stream.
        */

        setTimeout(
            playMusic,
            250
        );

    }

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousTrack() {

    if (
        !tracks.length
    ) {

        return;

    }


    currentTrack--;


    if (
        currentTrack < 0
    ) {

        currentTrack =
            tracks.length - 1;

    }


    loadTrack(
        currentTrack
    );


    setTimeout(
        playMusic,
        250
    );

}


/* =====================================================
   AUTOMATIC NEXT
===================================================== */

audio.addEventListener(
    "ended",
    function() {

        nextTrack(true);

    }
);


/* =====================================================
   AUDIO ERROR
===================================================== */

audio.addEventListener(
    "error",
    function() {

        console.error(
            "Audio error:",
            audio.error
        );


        /*
           If a particular stream is unavailable,
           automatically skip it.
        */

        if (
            tracks.length > 1
        ) {

            setTimeout(
                function() {

                    nextTrack(true);

                },
                400
            );

        }

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !audio.duration ||
            isNaN(audio.duration)
        ) {

            return;

        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percent + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function() {

        if (
            isFinite(
                audio.duration
            )
        ) {

            duration.textContent =
                formatTime(
                    audio.duration
                );

        }

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "click",
    function(event) {

        if (
            !audio.duration
        ) {

            return;

        }


        const rect =
            progress.getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            Math.max(
                0,
                Math.min(
                    1,
                    position /
                    rect.width
                )
            );


        audio.currentTime =
            percent *
            audio.duration;

    }
);


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    seconds
) {

    if (
        !seconds ||
        isNaN(seconds) ||
        seconds < 0
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secondsPart
    );

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    for (
        let i =
            array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* =====================================================
   MUTE
===================================================== */

function toggleMute() {

    audio.muted =
        !audio.muted;


    volumeButton.textContent =
        audio.muted
        ? "🔇"
        : "🔊";

}


/* =====================================================
   BACKGROUNDS
===================================================== */

const backgrounds = [

    "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1600&q=85",

    "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600&q=85",

    "https://images.unsplash.com/photo-1448375240586-882707db888b?w=1600&q=85",

    "https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=1600&q=85",

    "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600&q=85"

];


function changeBackground(
    index
) {

    const image =
        backgrounds[index];


    document.body.style.backgroundImage =
        `url("${image}")`;


    localStorage.setItem(
        "musicRoomBackground",
        image
    );


    document
        .querySelectorAll(
            ".bg-btn[data-bg]"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    Number(
                        button.dataset.bg
                    ) === index
                );

            }
        );

}


/* =====================================================
   CUSTOM BACKGROUND
===================================================== */

function customBackground(
    event
) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const image =
                e.target.result;


            document.body.style.backgroundImage =
                `url("${image}")`;


            /*
               Save locally so the image
               remains after refreshing.
            */

            try {

                localStorage.setItem(
                    "musicRoomCustomBackground",
                    image
                );

            } catch(error) {

                console.warn(
                    "Could not save image locally."
                );

            }

        };


    reader.readAsDataURL(
        file
    );

}


/* =====================================================
   RESTORE BACKGROUND
===================================================== */

const savedCustomBackground =
    localStorage.getItem(
        "musicRoomCustomBackground"
    );


const savedBackground =
    localStorage.getItem(
        "musicRoomBackground"
    );


if (
    savedCustomBackground
) {

    document.body.style.backgroundImage =
        `url("${savedCustomBackground}")`;

} else if (
    savedBackground
) {

    document.body.style.backgroundImage =
        `url("${savedBackground}")`;

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "clock"
    ).textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   START
===================================================== */

loadJamendoTracks();

</script>
